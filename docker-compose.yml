version: '3.9'

services:
  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    # vchord-suite 打包 VectorChord + vchord_bm25 + pg_tokenizer（md 竖井 BM25 关键词检索所需），基于官方 PG16，数据目录兼容
    image: tensorchord/vchord-suite:pg16-20260501
    container_name: kb-postgres
    environment:
      POSTGRES_DB: enterprise_kb
      POSTGRES_USER: ${PG_USER:-kb_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - kb-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${PG_USER:-kb_user}", "-d", "enterprise_kb"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── etcd (Milvus dependency) ─────────────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: kb-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    networks:
      - kb-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ── MinIO (Milvus object storage) ────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: kb-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    command: minio server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - kb-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Milvus standalone ────────────────────────────────────────
  milvus:
    image: milvusdb/milvus:v2.4.8
    container_name: kb-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    networks:
      - kb-network
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ── Attu (Milvus GUI) ────────────────────────────────────────
  attu:
    image: zilliz/attu:v2.4
    container_name: kb-attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "3000:3000"
    networks:
      - kb-network
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped

  # ── Redis (QnA 会话历史缓存) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kb-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - kb-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Kafka (用户画像离线推断事件总线, ADR-016, KRaft 单节点) ────
  kafka:
    image: apache/kafka:3.7.1
    container_name: kb-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 双监听：网络内 PLAINTEXT://kafka:9092 给 app；EXTERNAL://localhost:29092 给宿主本地开发
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-kb-kafka-cluster-00001}
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - kb-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ── Application ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: kb-app
    ports:
      - "8081:8081"
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/enterprise_kb
      SPRING_DATASOURCE_USERNAME: ${PG_USER:-kb_user}
      SPRING_DATASOURCE_PASSWORD: ${PG_PASSWORD}
      # Milvus
      SPRING_AI_VECTORSTORE_MILVUS_CLIENT_HOST: milvus
      SPRING_AI_VECTORSTORE_MILVUS_CLIENT_PORT: 19530
      # AI Providers
      LLAMA_CPP_BASE_URL: ${LLAMA_CPP_BASE_URL:-http://host.docker.internal:8079}
      LLAMA_CPP_MODEL: ${LLAMA_CPP_MODEL:-qwen3-vl-8b-instruct}
      LLAMA_CPP_API_KEY: ${LLAMA_CPP_API_KEY:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # JWT
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Ragas eval service
      RAGAS_ENDPOINT: http://kb-ragas:8000
      # Storage
      FILE_STORAGE_PATH: /app/uploads
      # ── 在线 LLM Tracing → LangFuse（ADR-015）──
      # 默认关闭；置 true 且 endpoint 就绪时才导出 trace。LangFuse 未起不影响应用启动。
      KB_TRACING_ENABLED: ${KB_TRACING_ENABLED:-false}
      KB_TRACING_SAMPLE_RATIO: ${KB_TRACING_SAMPLE_RATIO:-1.0}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://langfuse-web:3000/api/public/otel/v1/traces}
      LANGFUSE_OTLP_BASIC_AUTH: ${LANGFUSE_OTLP_BASIC_AUTH:-}
      # ── 用户画像离线推断 → Kafka（ADR-016，默认关）──
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KB_PROFILE_INJECTION_ENABLED: ${KB_PROFILE_INJECTION_ENABLED:-true}
      KB_PROFILE_INFERENCE_ENABLED: ${KB_PROFILE_INFERENCE_ENABLED:-false}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - kb-network
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  # ── Ragas evaluation service (on demand) ────────────────────
  kb-ragas:
    build:
      context: .
      dockerfile: kb-ragas/Dockerfile
    container_name: kb-ragas
    profiles:
      - eval
    ports:
      - "8000:8000"
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KB_RAGAS_MOCK: ${KB_RAGAS_MOCK:-false}
    networks:
      - kb-network
    restart: "no"

  # ── ClickHouse (LangFuse trace 存储，ADR-015) ────────────────
  # 新增容器；LangFuse 用它存 trace/observation。复用现有 PG/Redis/MinIO，仅 CH 是净增。
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: kb-clickhouse
    profiles:
      - tracing
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DB: default
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    networks:
      - kb-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── LangFuse worker (异步摄取 trace 写 ClickHouse) ───────────
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: kb-langfuse-worker
    profiles:
      - tracing
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: &langfuse-env
      # 复用现有 PostgreSQL 实例上的独立库 langfuse（由 postgres-init.sql 创建）
      DATABASE_URL: postgresql://${PG_USER:-kb_user}:${PG_PASSWORD}@postgres:5432/langfuse
      # 必需密钥：由部署环境生成注入，禁止使用示例默认值
      SALT: ${LANGFUSE_SALT:?LANGFUSE_SALT is required}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?LANGFUSE_ENCRYPTION_KEY is required (64 hex chars)}
      # ClickHouse
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      # 复用现有 Redis 实例（独立 db index 隔离）
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_PASSWORD}
      REDIS_DB: ${LANGFUSE_REDIS_DB:-3}
      # 复用现有 MinIO 实例上的独立 bucket langfuse（需预先创建）
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
    networks:
      - kb-network
    restart: unless-stopped

  # ── LangFuse web (UI + OTLP /api/public/otel ingestion) ──────
  langfuse-web:
    image: langfuse/langfuse:3
    container_name: kb-langfuse-web
    profiles:
      - tracing
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *langfuse-env
      # web 额外需要 NextAuth 配置
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?LANGFUSE_NEXTAUTH_SECRET is required}
      # 可选：首次启动自动初始化组织、项目、API key 与登录用户（用于无界面自举）
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-Enterprise KB Local}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-Enterprise KB Local}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    ports:
      # attu 已占用宿主 3000，LangFuse web 映射到 3001
      - "3001:3000"
    networks:
      - kb-network
    restart: unless-stopped


volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
  uploads_data:
  redis_data:
  kafka_data:
  clickhouse_data:
  clickhouse_logs:

networks:
  kb-network:
    name: kb-network
    driver: bridge
