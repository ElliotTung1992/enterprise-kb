version: '3.9'

services:
  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    # vchord-suite 打包 VectorChord + vchord_bm25 + pg_tokenizer（md 竖井 BM25 关键词检索所需），基于官方 PG16，数据目录兼容
    image: tensorchord/vchord-suite:pg16-20260501
    container_name: kb-postgres
    environment:
      POSTGRES_DB: enterprise_kb
      POSTGRES_USER: ${PG_USER:-kb_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - kb-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${PG_USER:-kb_user}", "-d", "enterprise_kb"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── etcd (Milvus dependency) ─────────────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: kb-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    networks:
      - kb-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ── MinIO (Milvus object storage) ────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: kb-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    command: minio server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - kb-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Milvus standalone ────────────────────────────────────────
  milvus:
    image: milvusdb/milvus:v2.4.8
    container_name: kb-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    networks:
      - kb-network
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ── Attu (Milvus GUI) ────────────────────────────────────────
  attu:
    image: zilliz/attu:v2.4
    container_name: kb-attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "3000:3000"
    networks:
      - kb-network
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped

  # ── Redis (QnA 会话历史缓存) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kb-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - kb-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Application ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: kb-app
    ports:
      - "8081:8081"
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/enterprise_kb
      SPRING_DATASOURCE_USERNAME: ${PG_USER:-kb_user}
      SPRING_DATASOURCE_PASSWORD: ${PG_PASSWORD}
      # Milvus
      SPRING_AI_VECTORSTORE_MILVUS_CLIENT_HOST: milvus
      SPRING_AI_VECTORSTORE_MILVUS_CLIENT_PORT: 19530
      # AI Providers
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # JWT
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Ragas eval service
      RAGAS_ENDPOINT: http://kb-ragas:8000
      # Storage
      FILE_STORAGE_PATH: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    networks:
      - kb-network
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Ragas evaluation service (on demand) ────────────────────
  kb-ragas:
    build:
      context: .
      dockerfile: kb-ragas/Dockerfile
    container_name: kb-ragas
    profiles:
      - eval
    ports:
      - "8000:8000"
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KB_RAGAS_MOCK: ${KB_RAGAS_MOCK:-false}
    networks:
      - kb-network
    restart: "no"


volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
  uploads_data:
  redis_data:

networks:
  kb-network:
    name: kb-network
    driver: bridge
