version: '3.9'

# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  app:
    image: ${REGISTRY:-your-registry}/enterprise-kb:${VERSION:-latest}
    build: !reset null
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2g
          cpus: '1.5'
    environment:
      JAVA_OPTS: "-Xmx1500m -Xms512m"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    restart: always

  postgres:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g

  milvus:
    restart: always
    deploy:
      resources:
        limits:
          memory: 4g

  etcd:
    restart: always

  minio:
    restart: always

  redis:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
