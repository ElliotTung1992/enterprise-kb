<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仪表盘 — 企业知识库</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/app.css" rel="stylesheet">
<style>body{visibility:hidden}</style>
</head>
<body>

<!-- Sidebar -->
<nav class="kb-sidebar">
  <div class="brand"><i class="bi bi-journal-bookmark-fill me-2"></i>知识库</div>
  <ul class="nav flex-column mt-2 flex-grow-1">
    <li class="nav-item"><a class="nav-link active" href="/dashboard.html"><i class="bi bi-grid-1x2"></i>仪表盘</a></li>
    <li class="nav-item"><a class="nav-link" href="/upload.html"><i class="bi bi-cloud-upload"></i>上传文档</a></li>
    <li class="nav-item"><a class="nav-link" href="/search.html"><i class="bi bi-search"></i>搜索</a></li>
    <li class="nav-item"><a class="nav-link" href="/qa.html"><i class="bi bi-chat-dots"></i>AI 问答</a></li>
    <li class="nav-item"><a class="nav-link" href="/tags.html"><i class="bi bi-tags"></i>标签管理</a></li>
  </ul>
  <div class="p-3 border-top" style="border-color:#312e81!important">
    <small class="d-block text-truncate mb-2" id="sidebar-username"></small>
    <a href="#" onclick="logout()" class="text-decoration-none" style="color:#c7d2fe;font-size:.85rem">
      <i class="bi bi-box-arrow-right me-1"></i>退出登录
    </a>
  </div>
</nav>

<!-- Main -->
<div class="kb-main">
  <div class="kb-topbar">
    <div class="d-flex align-items-center gap-2">
      <select class="form-select form-select-sm" id="space-select" style="min-width:200px">
        <option value="">— 选择空间 —</option>
      </select>
      <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#space-modal" title="新建空间">
        <i class="bi bi-plus-lg"></i>
      </button>
    </div>
    <span class="text-muted small">欢迎回来，<strong id="topbar-username"></strong></span>
  </div>

  <div class="p-4">
    <!-- Stats row -->
    <div class="row g-3 mb-4" id="stats-row">
      <div class="col-md-3">
        <div class="kb-card text-center">
          <div class="fs-2 fw-bold text-primary" id="stat-docs">—</div>
          <div class="text-muted small">文档总数</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="kb-card text-center">
          <div class="fs-2 fw-bold text-success" id="stat-ready">—</div>
          <div class="text-muted small">已就绪</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="kb-card text-center">
          <div class="fs-2 fw-bold text-warning" id="stat-processing">—</div>
          <div class="text-muted small">处理中</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="kb-card text-center">
          <div class="fs-2 fw-bold text-info" id="stat-spaces">—</div>
          <div class="text-muted small">空间数</div>
        </div>
      </div>
    </div>

    <!-- Recent docs -->
    <div class="kb-card">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h6 class="fw-bold mb-0"><i class="bi bi-clock-history me-2 text-primary"></i>最近文档</h6>
        <a href="/upload.html" class="btn btn-sm btn-primary"><i class="bi bi-plus me-1"></i>上传</a>
      </div>
      <div id="recent-docs">
        <div class="text-center text-muted py-4">请先选择一个空间</div>
      </div>
    </div>
  </div>
</div>

<!-- Create Space Modal -->
<div class="modal fade" id="space-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">新建空间</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label fw-semibold">空间名称 <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="space-name" placeholder="如：技术文档、产品手册">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">描述</label>
          <textarea class="form-control" id="space-desc" rows="2" placeholder="空间用途说明（可选）"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" id="btn-create-space">创建</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
requireAuth();

const username = localStorage.getItem('username') || '';
document.getElementById('sidebar-username').textContent = username;
document.getElementById('topbar-username').textContent = username;

const statusColors = { PENDING: 'badge-pending', PROCESSING: 'badge-processing', READY: 'badge-ready', FAILED: 'badge-failed' };
const statusLabels = { PENDING: '待处理', PROCESSING: '处理中', READY: '就绪', FAILED: '失败' };

async function loadSpaces() {
  const res = await apiFetch('/spaces');
  const spaces = res.data || [];
  const sel = document.getElementById('space-select');
  spaces.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id; opt.textContent = s.name;
    sel.appendChild(opt);
  });
  document.getElementById('stat-spaces').textContent = spaces.length;

  const saved = localStorage.getItem('current_space_id');
  if (saved && spaces.find(s => s.id === saved)) sel.value = saved;
  else if (spaces.length) sel.value = spaces[0].id;

  if (sel.value) loadDashboard(sel.value);
  sel.addEventListener('change', () => {
    setCurrentSpace(sel.value, sel.options[sel.selectedIndex].text);
    loadDashboard(sel.value);
  });
}

async function loadDashboard(spaceId) {
  setCurrentSpace(spaceId, document.getElementById('space-select').options[document.getElementById('space-select').selectedIndex]?.text || '');
  const res = await apiFetch(`/spaces/${spaceId}/documents?size=10&sort=createdAt,desc`);
  const docs = res.data?.content || [];
  document.getElementById('stat-docs').textContent = res.data?.totalElements ?? 0;
  document.getElementById('stat-ready').textContent = docs.filter(d => d.status === 'READY').length;
  document.getElementById('stat-processing').textContent = docs.filter(d => d.status === 'PROCESSING' || d.status === 'PENDING').length;

  const container = document.getElementById('recent-docs');
  if (!docs.length) { container.innerHTML = '<div class="text-center text-muted py-3">暂无文档</div>'; return; }
  container.innerHTML = docs.map(d => `
    <div class="d-flex align-items-center py-2 border-bottom">
      <i class="bi ${mimeIcon(d.mimeType)} me-3 text-primary fs-5"></i>
      <div class="flex-grow-1 overflow-hidden">
        <div class="fw-semibold text-truncate">${escHtml(d.title)}</div>
        <small class="text-muted">${formatSize(d.fileSizeBytes)} · ${formatDate(d.createdAt)}</small>
      </div>
      <span class="badge ${statusColors[d.status] || ''} ms-2">${statusLabels[d.status] || d.status}</span>
    </div>`).join('');
}

function mimeIcon(mime) {
  if (!mime) return 'bi-file';
  if (mime.includes('pdf')) return 'bi-file-earmark-pdf text-danger';
  if (mime.includes('word')) return 'bi-file-earmark-word text-primary';
  if (mime.includes('markdown') || mime.includes('plain')) return 'bi-file-earmark-text text-secondary';
  return 'bi-file-earmark';
}
function formatSize(b) { if (!b) return ''; if (b < 1024) return b + ' B'; if (b < 1048576) return (b/1024).toFixed(1) + ' KB'; return (b/1048576).toFixed(1) + ' MB'; }
function formatDate(s) { return s ? new Date(s).toLocaleDateString('zh-CN') : ''; }
function escHtml(s) { return s?.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') || ''; }

document.getElementById('btn-create-space').addEventListener('click', async () => {
  const name = document.getElementById('space-name').value.trim();
  if (!name) { showToast('空间名称不能为空', 'error'); return; }
  try {
    const res = await apiFetch('/spaces', {
      method: 'POST',
      body: JSON.stringify({ name, description: document.getElementById('space-desc').value.trim() || null })
    });
    bootstrap.Modal.getInstance(document.getElementById('space-modal'))?.hide();
    document.getElementById('space-name').value = '';
    document.getElementById('space-desc').value = '';
    showToast('空间创建成功');
    const sel = document.getElementById('space-select');
    const opt = document.createElement('option');
    opt.value = res.data.id; opt.textContent = res.data.name;
    sel.appendChild(opt);
    sel.value = res.data.id;
    document.getElementById('stat-spaces').textContent = sel.options.length - 1;
    loadDashboard(res.data.id);
  } catch (err) { showToast(err.message, 'error'); }
});

loadSpaces().catch(console.error);
</script>
</body>
</html>
