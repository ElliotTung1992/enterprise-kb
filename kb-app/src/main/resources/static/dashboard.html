<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仪表盘 — 企业知识库</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/app.css" rel="stylesheet">
<style>body{visibility:hidden}.stat-card{cursor:pointer;transition:box-shadow .15s,transform .15s}.stat-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12);transform:translateY(-2px)}</style>
</head>
<body>

<!-- Sidebar -->
<nav class="kb-sidebar">
  <div class="brand"><i class="bi bi-journal-bookmark-fill me-2"></i>知识库</div>
  <ul class="nav flex-column mt-2 flex-grow-1">
    <li class="nav-item"><a class="nav-link active" href="/dashboard.html"><i class="bi bi-grid-1x2"></i>仪表盘</a></li>
    <li class="nav-item"><a class="nav-link" href="/upload.html"><i class="bi bi-cloud-upload"></i>上传文档</a></li>
    <li class="nav-item"><a class="nav-link" href="/search.html"><i class="bi bi-search"></i>搜索</a></li>
    <li class="nav-item"><a class="nav-link" href="/qa.html"><i class="bi bi-chat-dots"></i>AI 问答</a></li>
    <li class="nav-item"><a class="nav-link" href="/tags.html"><i class="bi bi-tags"></i>标签管理</a></li>
  </ul>
  <div class="p-3 border-top" style="border-color:#312e81!important">
    <small class="d-block text-truncate mb-2" id="sidebar-username"></small>
    <a href="/index.html" style="color:#c7d2fe;font-size:.82rem;display:block;margin-bottom:.4rem"><i class="bi bi-house me-1"></i>返回首页</a>
    <a href="#" onclick="logout()" class="text-decoration-none" style="color:#c7d2fe;font-size:.85rem">
      <i class="bi bi-box-arrow-right me-1"></i>退出登录
    </a>
  </div>
</nav>

<!-- Main -->
<div class="kb-main">
  <div class="kb-topbar">
    <div class="d-flex align-items-center gap-2">
      <select class="form-select form-select-sm" id="space-select" style="min-width:200px">
        <option value="">— 选择空间 —</option>
      </select>
      <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#space-modal" title="新建空间">
        <i class="bi bi-plus-lg"></i>
      </button>
    </div>
    <span class="text-muted small">欢迎回来，<strong id="topbar-username"></strong></span>
  </div>

  <div class="p-4">
    <!-- Stats row -->
    <div class="row g-3 mb-4" id="stats-row">
      <div class="col-md-3">
        <div class="kb-card text-center stat-card" id="card-docs" title="查看所有文档">
          <div class="fs-2 fw-bold text-primary" id="stat-docs">—</div>
          <div class="text-muted small">文档总数 <i class="bi bi-arrow-right-short"></i></div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="kb-card text-center stat-card" id="card-ready" title="查看已就绪文档">
          <div class="fs-2 fw-bold text-success" id="stat-ready">—</div>
          <div class="text-muted small">已就绪 <i class="bi bi-arrow-right-short"></i></div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="kb-card text-center stat-card" id="card-processing" title="查看处理中文档">
          <div class="fs-2 fw-bold text-warning" id="stat-processing">—</div>
          <div class="text-muted small">处理中 <i class="bi bi-arrow-right-short"></i></div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="kb-card text-center stat-card" id="card-spaces" title="查看所有空间">
          <div class="fs-2 fw-bold text-info" id="stat-spaces">—</div>
          <div class="text-muted small">空间数 <i class="bi bi-arrow-right-short"></i></div>
        </div>
      </div>
    </div>

    <!-- Recent docs -->
    <div class="kb-card">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h6 class="fw-bold mb-0"><i class="bi bi-clock-history me-2 text-primary"></i>最近文档</h6>
        <a href="/upload.html" class="btn btn-sm btn-primary"><i class="bi bi-plus me-1"></i>上传</a>
      </div>
      <div id="recent-docs">
        <div class="text-center text-muted py-4">请先选择一个空间</div>
      </div>
    </div>
  </div>
</div>

<!-- Create Space Modal -->
<div class="modal fade" id="space-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">新建空间</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label fw-semibold">空间名称 <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="space-name" placeholder="如：技术文档、产品手册">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">描述</label>
          <textarea class="form-control" id="space-desc" rows="2" placeholder="空间用途说明（可选）"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" id="btn-create-space">创建</button>
      </div>
    </div>
  </div>
</div>

<!-- Spaces List Modal -->
<div class="modal fade" id="spaces-list-modal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-collection me-2 text-info"></i>所有空间</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-0">
        <div id="spaces-list-body" class="list-group list-group-flush"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary btn-sm" data-bs-dismiss="modal"
                data-bs-toggle="modal" data-bs-target="#space-modal">
          <i class="bi bi-plus me-1"></i>新建空间
        </button>
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">关闭</button>
      </div>
    </div>
  </div>
</div>

<!-- Delete Space Confirm Modal -->
<div class="modal fade" id="delete-space-modal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title text-danger"><i class="bi bi-exclamation-triangle-fill me-2"></i>删除空间</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body pt-2">
        <p class="mb-1">确认删除空间 <strong id="delete-space-name" class="text-danger"></strong>？</p>
        <p class="text-muted small mb-0">空间内所有文档及向量数据将被永久删除，此操作不可恢复。</p>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-danger" id="btn-confirm-delete-space">
          <i class="bi bi-trash3 me-1"></i>确认删除
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Docs List Modal -->
<div class="modal fade" id="docs-modal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="docs-modal-title"><i class="bi bi-files me-2 text-primary"></i>文档列表</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex gap-2 mb-3 flex-wrap">
          <input type="radio" class="btn-check" name="doc-filter" id="df-all" value="">
          <label class="btn btn-sm btn-outline-secondary" for="df-all">全部</label>
          <input type="radio" class="btn-check" name="doc-filter" id="df-ready" value="READY">
          <label class="btn btn-sm btn-outline-success" for="df-ready">已就绪</label>
          <input type="radio" class="btn-check" name="doc-filter" id="df-processing" value="PROCESSING">
          <label class="btn btn-sm btn-outline-warning" for="df-processing">处理中</label>
          <input type="radio" class="btn-check" name="doc-filter" id="df-pending" value="PENDING">
          <label class="btn btn-sm btn-outline-secondary" for="df-pending">待处理</label>
          <input type="radio" class="btn-check" name="doc-filter" id="df-failed" value="FAILED">
          <label class="btn btn-sm btn-outline-danger" for="df-failed">失败</label>
        </div>
        <div id="docs-modal-body"></div>
      </div>
      <div class="modal-footer">
        <a href="/upload.html" class="btn btn-primary btn-sm"><i class="bi bi-plus me-1"></i>上传文档</a>
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">关闭</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
requireAuth();

const username = localStorage.getItem('username') || '';
document.getElementById('sidebar-username').textContent = username;
document.getElementById('topbar-username').textContent = username;

const statusColors = { PENDING: 'badge-pending', PROCESSING: 'badge-processing', READY: 'badge-ready', FAILED: 'badge-failed' };
const statusLabels = { PENDING: '待处理', PROCESSING: '处理中', READY: '就绪', FAILED: '失败' };

let allSpaces = [];

// ── Spaces ────────────────────────────────────────────────────────────────

async function loadSpaces() {
  const res = await apiFetch('/spaces');
  allSpaces = res.data || [];
  const sel = document.getElementById('space-select');
  allSpaces.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id; opt.textContent = s.name;
    sel.appendChild(opt);
  });
  document.getElementById('stat-spaces').textContent = allSpaces.length;

  const saved = localStorage.getItem('current_space_id');
  if (saved && allSpaces.find(s => s.id === saved)) sel.value = saved;
  else if (allSpaces.length) sel.value = allSpaces[0].id;

  if (sel.value) loadDashboard(sel.value);
  sel.addEventListener('change', () => {
    setCurrentSpace(sel.value, sel.options[sel.selectedIndex].text);
    loadDashboard(sel.value);
  });
}

function openSpacesList() {
  const body = document.getElementById('spaces-list-body');
  if (!allSpaces.length) {
    body.innerHTML = '<div class="text-center text-muted py-4">暂无空间，点击下方按钮创建</div>';
  } else {
    const currentId = document.getElementById('space-select').value;
    // 用索引传参，完全规避 HTML 属性内字符串转义问题
    body.innerHTML = allSpaces.map((s, i) => `
      <div class="list-group-item d-flex align-items-center gap-3 px-4 py-3">
        <a href="#" class="d-flex align-items-center gap-3 flex-grow-1 overflow-hidden text-decoration-none text-dark"
           onclick="switchToSpace(${i});return false;">
          <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0
                      bg-info bg-opacity-10 text-info" style="width:40px;height:40px;font-size:1.1rem">
            <i class="bi bi-collection"></i>
          </div>
          <div class="flex-grow-1 overflow-hidden">
            <div class="fw-semibold text-truncate">${escHtml(s.name)}
              ${s.id === currentId ? '<span class="badge bg-info ms-1" style="font-size:.7rem">当前</span>' : ''}
            </div>
            ${s.description ? `<small class="text-muted text-truncate d-block">${escHtml(s.description)}</small>` : ''}
          </div>
          <span class="text-muted small d-flex align-items-center gap-1 flex-shrink-0">
            <i class="bi bi-files"></i>查看文档
          </span>
        </a>
        <button class="btn btn-sm btn-outline-danger flex-shrink-0" title="删除空间"
                onclick="confirmDeleteSpace(${i});return false;">
          <i class="bi bi-trash3"></i>
        </button>
      </div>`).join('');
  }
  new bootstrap.Modal(document.getElementById('spaces-list-modal')).show();
}

let pendingDeleteIdx = null;

function confirmDeleteSpace(idx) {
  pendingDeleteIdx = idx;
  document.getElementById('delete-space-name').textContent = `「${allSpaces[idx].name}」`;
  new bootstrap.Modal(document.getElementById('delete-space-modal')).show();
}

document.getElementById('btn-confirm-delete-space').addEventListener('click', async () => {
  if (pendingDeleteIdx === null) return;
  const space = allSpaces[pendingDeleteIdx];
  const confirmModal = bootstrap.Modal.getInstance(document.getElementById('delete-space-modal'));
  try {
    await apiFetch(`/spaces/${space.id}`, { method: 'DELETE' });
    confirmModal?.hide();

    allSpaces.splice(pendingDeleteIdx, 1);
    pendingDeleteIdx = null;

    const sel = document.getElementById('space-select');
    const opt = sel.querySelector(`option[value="${space.id}"]`);
    if (opt) opt.remove();
    document.getElementById('stat-spaces').textContent = allSpaces.length;

    if (sel.value === space.id) {
      sel.value = allSpaces[0]?.id || '';
      if (sel.value) loadDashboard(sel.value);
      else document.getElementById('recent-docs').innerHTML = '<div class="text-center text-muted py-4">请先选择一个空间</div>';
    }

    showToast('空间已删除');

    const spacesListEl = document.getElementById('spaces-list-modal');
    if (bootstrap.Modal.getInstance(spacesListEl)) openSpacesList();
  } catch (err) {
    showToast(err.message, 'error');
  }
});

function switchToSpace(idx) {
  const s = allSpaces[idx];
  const spaceId = s.id;
  const spaceName = s.name;

  const sel = document.getElementById('space-select');
  sel.value = spaceId;
  setCurrentSpace(spaceId, spaceName);
  loadDashboard(spaceId);

  const spacesEl = document.getElementById('spaces-list-modal');
  const spacesModal = bootstrap.Modal.getInstance(spacesEl);

  function openDocs() {
    document.getElementById('docs-modal-title').innerHTML =
      `<i class="bi bi-files me-2 text-primary"></i>${escHtml(spaceName)} — 文档列表`;
    document.getElementById('df-all').checked = true;
    const docsModal = new bootstrap.Modal(document.getElementById('docs-modal'));
    docsModal.show();
    renderDocsModal('', spaceId);
    document.querySelectorAll('input[name="doc-filter"]').forEach(input => {
      input.onchange = () => renderDocsModal(input.value, spaceId);
    });
  }

  if (spacesModal) {
    spacesEl.addEventListener('hidden.bs.modal', openDocs, { once: true });
    spacesModal.hide();
  } else {
    openDocs();
  }
}

// ── Docs modal ────────────────────────────────────────────────────────────

function openDocsModal(filterStatus) {
  const spaceId = document.getElementById('space-select').value;
  if (!spaceId) { showToast('请先选择空间', 'error'); return; }

  const radio = document.querySelector(`input[name="doc-filter"][value="${filterStatus}"]`);
  if (radio) radio.checked = true;

  new bootstrap.Modal(document.getElementById('docs-modal')).show();
  renderDocsModal(filterStatus, spaceId);

  document.querySelectorAll('input[name="doc-filter"]').forEach(input => {
    input.onchange = () => renderDocsModal(input.value, spaceId);
  });
}

async function renderDocsModal(filterStatus, spaceId) {
  const body = document.getElementById('docs-modal-body');
  body.innerHTML = '<div class="text-center py-4"><span class="spinner-border text-primary"></span></div>';
  try {
    const params = new URLSearchParams({ size: 50 });
    if (filterStatus) params.set('status', filterStatus);
    const res = await apiFetch(`/spaces/${spaceId}/documents?${params}`);
    const docs = res.data?.content || [];
    if (!docs.length) {
      body.innerHTML = '<div class="text-center text-muted py-4">暂无文档</div>';
      return;
    }
    body.innerHTML = docs.map(d => `
      <div class="d-flex align-items-center gap-3 py-2 border-bottom">
        <i class="bi ${mimeIcon(d.mimeType)} fs-5 flex-shrink-0"></i>
        <div class="flex-grow-1 overflow-hidden">
          <div class="fw-semibold text-truncate">${escHtml(d.title)}</div>
          <small class="text-muted">${formatSize(d.fileSizeBytes)} · ${formatDate(d.createdAt)}${d.chunkCount ? ' · ' + d.chunkCount + ' 块' : ''}</small>
        </div>
        <span class="badge ${statusColors[d.status] || ''} flex-shrink-0">${statusLabels[d.status] || d.status}</span>
        <button class="btn btn-sm btn-outline-danger flex-shrink-0" title="删除"
                onclick="deleteDoc('${d.id}','${spaceId}')">
          <i class="bi bi-trash3"></i>
        </button>
      </div>`).join('');
  } catch (err) {
    body.innerHTML = `<div class="alert alert-danger">${escHtml(err.message)}</div>`;
  }
}

async function deleteDoc(docId, spaceId) {
  if (!confirm('确认删除此文档？此操作不可恢复。')) return;
  try {
    await apiFetch(`/spaces/${spaceId}/documents/${docId}`, { method: 'DELETE' });
    showToast('文档已删除');
    const activeFilter = document.querySelector('input[name="doc-filter"]:checked')?.value || '';
    renderDocsModal(activeFilter, spaceId);
    loadDashboard(spaceId);
  } catch (err) { showToast(err.message, 'error'); }
}

document.getElementById('card-docs').addEventListener('click', () => openDocsModal(''));
document.getElementById('card-ready').addEventListener('click', () => openDocsModal('READY'));
document.getElementById('card-processing').addEventListener('click', () => openDocsModal('PROCESSING'));
document.getElementById('card-spaces').addEventListener('click', openSpacesList);

// ── Dashboard ─────────────────────────────────────────────────────────────

async function loadDashboard(spaceId) {
  setCurrentSpace(spaceId, document.getElementById('space-select').options[document.getElementById('space-select').selectedIndex]?.text || '');
  const res = await apiFetch(`/spaces/${spaceId}/documents?size=10`);
  const docs = res.data?.content || [];
  document.getElementById('stat-docs').textContent = res.data?.totalElements ?? 0;
  document.getElementById('stat-ready').textContent = docs.filter(d => d.status === 'READY').length;
  document.getElementById('stat-processing').textContent = docs.filter(d => d.status === 'PROCESSING' || d.status === 'PENDING').length;

  const container = document.getElementById('recent-docs');
  if (!docs.length) { container.innerHTML = '<div class="text-center text-muted py-3">暂无文档</div>'; return; }
  container.innerHTML = docs.map(d => `
    <div class="d-flex align-items-center py-2 border-bottom">
      <i class="bi ${mimeIcon(d.mimeType)} me-3 text-primary fs-5"></i>
      <div class="flex-grow-1 overflow-hidden">
        <div class="fw-semibold text-truncate">${escHtml(d.title)}</div>
        <small class="text-muted">${formatSize(d.fileSizeBytes)} · ${formatDate(d.createdAt)}</small>
      </div>
      <span class="badge ${statusColors[d.status] || ''} ms-2">${statusLabels[d.status] || d.status}</span>
    </div>`).join('');
}

// ── Create space ──────────────────────────────────────────────────────────

document.getElementById('btn-create-space').addEventListener('click', async () => {
  const name = document.getElementById('space-name').value.trim();
  if (!name) { showToast('空间名称不能为空', 'error'); return; }
  try {
    const res = await apiFetch('/spaces', {
      method: 'POST',
      body: JSON.stringify({ name, description: document.getElementById('space-desc').value.trim() || null })
    });
    bootstrap.Modal.getInstance(document.getElementById('space-modal'))?.hide();
    document.getElementById('space-name').value = '';
    document.getElementById('space-desc').value = '';
    showToast('空间创建成功');
    const newSpace = res.data;
    allSpaces.push(newSpace);
    const sel = document.getElementById('space-select');
    const opt = document.createElement('option');
    opt.value = newSpace.id; opt.textContent = newSpace.name;
    sel.appendChild(opt);
    sel.value = newSpace.id;
    document.getElementById('stat-spaces').textContent = allSpaces.length;
    loadDashboard(newSpace.id);
  } catch (err) { showToast(err.message, 'error'); }
});

// ── Helpers ───────────────────────────────────────────────────────────────

function mimeIcon(mime) {
  if (!mime) return 'bi-file-earmark';
  if (mime.includes('pdf')) return 'bi-file-earmark-pdf text-danger';
  if (mime.includes('word')) return 'bi-file-earmark-word text-primary';
  if (mime.includes('html')) return 'bi-file-earmark-code text-warning';
  if (mime.includes('markdown') || mime.includes('plain')) return 'bi-file-earmark-text text-secondary';
  return 'bi-file-earmark';
}
function formatSize(b) { if (!b) return ''; if (b < 1024) return b + ' B'; if (b < 1048576) return (b/1024).toFixed(1) + ' KB'; return (b/1048576).toFixed(1) + ' MB'; }
function formatDate(s) { return s ? new Date(s).toLocaleDateString('zh-CN') : ''; }
function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

loadSpaces().catch(console.error);
</script>
</body>
</html>
