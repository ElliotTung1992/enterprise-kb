<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仪表盘 — 企业知识库</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/app.css" rel="stylesheet">
<style>body{visibility:hidden}.stat-card{cursor:pointer;transition:box-shadow .15s,transform .15s}.stat-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12);transform:translateY(-2px)}</style>
</head>
<body>

<!-- Sidebar -->
<nav class="kb-sidebar">
  <div class="brand"><i class="bi bi-journal-bookmark-fill me-2"></i>知识库</div>
  <ul class="nav flex-column mt-2 flex-grow-1">
    <li class="nav-item"><a class="nav-link active" href="/dashboard.html"><i class="bi bi-grid-1x2"></i>仪表盘</a></li>
    <li class="nav-item"><a class="nav-link" href="/md-rag.html"><i class="bi bi-markdown"></i>Markdown RAG</a></li>
  </ul>
  <div class="p-3 border-top" style="border-color:#312e81!important">
    <small class="d-block text-truncate mb-2" id="sidebar-username"></small>
    <a href="/index.html" style="color:#c7d2fe;font-size:.82rem;display:block;margin-bottom:.4rem"><i class="bi bi-house me-1"></i>返回首页</a>
    <a href="#" onclick="logout()" class="text-decoration-none" style="color:#c7d2fe;font-size:.85rem">
      <i class="bi bi-box-arrow-right me-1"></i>退出登录
    </a>
  </div>
</nav>

<!-- Main -->
<div class="kb-main">
  <div class="kb-topbar">
    <div class="d-flex align-items-center gap-2">
      <select class="form-select form-select-sm" id="space-select" style="min-width:200px">
        <option value="">— 选择空间 —</option>
      </select>
      <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#space-modal" title="新建空间">
        <i class="bi bi-plus-lg"></i>
      </button>
    </div>
    <span class="text-muted small">欢迎回来，<strong id="topbar-username"></strong></span>
  </div>

  <div class="p-4">
    <!-- Stats row -->
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="kb-card text-center stat-card" id="card-spaces" title="管理所有空间">
          <div class="fs-2 fw-bold text-info" id="stat-spaces">—</div>
          <div class="text-muted small">空间数 <i class="bi bi-arrow-right-short"></i></div>
        </div>
      </div>
    </div>

    <!-- Markdown RAG 入口 -->
    <div class="kb-card">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div class="d-flex align-items-center gap-3">
          <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
               style="width:48px;height:48px;background:#ede9fe;color:#6d28d9;font-size:1.4rem">
            <i class="bi bi-markdown"></i>
          </div>
          <div>
            <h6 class="fw-bold mb-1">Markdown 结构化问答</h6>
            <div class="text-muted small mb-0">上传 Markdown 文档、按文档结构检索并问答。文档的上传与问答均在 Markdown RAG 页面完成。</div>
          </div>
        </div>
        <a href="/md-rag.html" class="btn btn-primary"><i class="bi bi-arrow-right-circle me-1"></i>进入 Markdown RAG</a>
      </div>
    </div>
  </div>
</div>

<!-- Create Space Modal -->
<div class="modal fade" id="space-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">新建空间</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label fw-semibold">空间名称 <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="space-name" placeholder="如：技术文档、产品手册">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">描述</label>
          <textarea class="form-control" id="space-desc" rows="2" placeholder="空间用途说明（可选）"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" id="btn-create-space">创建</button>
      </div>
    </div>
  </div>
</div>

<!-- Spaces List Modal -->
<div class="modal fade" id="spaces-list-modal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-collection me-2 text-info"></i>所有空间</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-0">
        <div id="spaces-list-body" class="list-group list-group-flush"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary btn-sm" data-bs-dismiss="modal"
                data-bs-toggle="modal" data-bs-target="#space-modal">
          <i class="bi bi-plus me-1"></i>新建空间
        </button>
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">关闭</button>
      </div>
    </div>
  </div>
</div>

<!-- Delete Space Confirm Modal -->
<div class="modal fade" id="delete-space-modal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title text-danger"><i class="bi bi-exclamation-triangle-fill me-2"></i>删除空间</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body pt-2">
        <p class="mb-1">确认删除空间 <strong id="delete-space-name" class="text-danger"></strong>？</p>
        <p class="text-muted small mb-0">空间内所有 Markdown 文档及向量数据将被永久删除，此操作不可恢复。</p>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-danger" id="btn-confirm-delete-space">
          <i class="bi bi-trash3 me-1"></i>确认删除
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
requireAuth();

const username = localStorage.getItem('username') || '';
document.getElementById('sidebar-username').textContent = username;
document.getElementById('topbar-username').textContent = username;

let allSpaces = [];

// ── Spaces ────────────────────────────────────────────────────────────────

async function loadSpaces() {
  const res = await apiFetch('/spaces');
  allSpaces = res.data || [];
  const sel = document.getElementById('space-select');
  allSpaces.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id; opt.textContent = s.name;
    sel.appendChild(opt);
  });
  document.getElementById('stat-spaces').textContent = allSpaces.length;

  const saved = localStorage.getItem('current_space_id');
  if (saved && allSpaces.find(s => s.id === saved)) sel.value = saved;
  else if (allSpaces.length) sel.value = allSpaces[0].id;

  if (sel.value) setCurrentSpace(sel.value, sel.options[sel.selectedIndex].text);
  sel.addEventListener('change', () => {
    setCurrentSpace(sel.value, sel.options[sel.selectedIndex].text);
  });
}

function openSpacesList() {
  const body = document.getElementById('spaces-list-body');
  if (!allSpaces.length) {
    body.innerHTML = '<div class="text-center text-muted py-4">暂无空间，点击下方按钮创建</div>';
  } else {
    const currentId = document.getElementById('space-select').value;
    // 用索引传参，完全规避 HTML 属性内字符串转义问题
    body.innerHTML = allSpaces.map((s, i) => `
      <div class="list-group-item d-flex align-items-center gap-3 px-4 py-3">
        <a href="#" class="d-flex align-items-center gap-3 flex-grow-1 overflow-hidden text-decoration-none text-dark"
           onclick="switchToSpace(${i});return false;">
          <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0
                      bg-info bg-opacity-10 text-info" style="width:40px;height:40px;font-size:1.1rem">
            <i class="bi bi-collection"></i>
          </div>
          <div class="flex-grow-1 overflow-hidden">
            <div class="fw-semibold text-truncate">${escHtml(s.name)}
              ${s.id === currentId ? '<span class="badge bg-info ms-1" style="font-size:.7rem">当前</span>' : ''}
            </div>
            ${s.description ? `<small class="text-muted text-truncate d-block">${escHtml(s.description)}</small>` : ''}
          </div>
        </a>
        <button class="btn btn-sm btn-outline-danger flex-shrink-0" title="删除空间"
                onclick="confirmDeleteSpace(${i});return false;">
          <i class="bi bi-trash3"></i>
        </button>
      </div>`).join('');
  }
  new bootstrap.Modal(document.getElementById('spaces-list-modal')).show();
}

let pendingDeleteIdx = null;

function confirmDeleteSpace(idx) {
  pendingDeleteIdx = idx;
  document.getElementById('delete-space-name').textContent = `「${allSpaces[idx].name}」`;
  new bootstrap.Modal(document.getElementById('delete-space-modal')).show();
}

document.getElementById('btn-confirm-delete-space').addEventListener('click', async () => {
  if (pendingDeleteIdx === null) return;
  const space = allSpaces[pendingDeleteIdx];
  const confirmModal = bootstrap.Modal.getInstance(document.getElementById('delete-space-modal'));
  try {
    await apiFetch(`/spaces/${space.id}`, { method: 'DELETE' });
    confirmModal?.hide();

    allSpaces.splice(pendingDeleteIdx, 1);
    pendingDeleteIdx = null;

    const sel = document.getElementById('space-select');
    const opt = sel.querySelector(`option[value="${space.id}"]`);
    if (opt) opt.remove();
    document.getElementById('stat-spaces').textContent = allSpaces.length;

    if (sel.value === space.id) {
      sel.value = allSpaces[0]?.id || '';
      if (sel.value) setCurrentSpace(sel.value, sel.options[sel.selectedIndex].text);
    }

    showToast('空间已删除');

    const spacesListEl = document.getElementById('spaces-list-modal');
    if (bootstrap.Modal.getInstance(spacesListEl)) openSpacesList();
  } catch (err) {
    showToast(err.message, 'error');
  }
});

function switchToSpace(idx) {
  const s = allSpaces[idx];
  const sel = document.getElementById('space-select');
  sel.value = s.id;
  setCurrentSpace(s.id, s.name);
  bootstrap.Modal.getInstance(document.getElementById('spaces-list-modal'))?.hide();
}

document.getElementById('card-spaces').addEventListener('click', openSpacesList);

// ── Create space ──────────────────────────────────────────────────────────

document.getElementById('btn-create-space').addEventListener('click', async () => {
  const name = document.getElementById('space-name').value.trim();
  if (!name) { showToast('空间名称不能为空', 'error'); return; }
  try {
    const res = await apiFetch('/spaces', {
      method: 'POST',
      body: JSON.stringify({ name, description: document.getElementById('space-desc').value.trim() || null })
    });
    bootstrap.Modal.getInstance(document.getElementById('space-modal'))?.hide();
    document.getElementById('space-name').value = '';
    document.getElementById('space-desc').value = '';
    showToast('空间创建成功');
    const newSpace = res.data;
    allSpaces.push(newSpace);
    const sel = document.getElementById('space-select');
    const opt = document.createElement('option');
    opt.value = newSpace.id; opt.textContent = newSpace.name;
    sel.appendChild(opt);
    sel.value = newSpace.id;
    setCurrentSpace(newSpace.id, newSpace.name);
    document.getElementById('stat-spaces').textContent = allSpaces.length;
  } catch (err) { showToast(err.message, 'error'); }
});

// ── Helpers ───────────────────────────────────────────────────────────────

function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

loadSpaces().catch(console.error);
</script>
</body>
</html>
