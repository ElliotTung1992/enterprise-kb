<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商城客户助手 — 企业知识库</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/app.css" rel="stylesheet">
<style>
body { visibility: hidden }
.qa-sessions-sidebar {
  position: fixed;
  left: var(--kb-sidebar-width);
  top: 0;
  width: 220px;
  height: 100vh;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  display: flex;
  flex-direction: column;
  z-index: 50;
  overflow: hidden;
}
.qa-sessions-header {
  padding: .65rem .875rem;
  font-size: .78rem;
  font-weight: 600;
  color: #64748b;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
  background: #f8fafc;
}
#sessions-list { overflow-y: auto; flex: 1; }
.session-item {
  padding: .55rem .875rem;
  cursor: pointer;
  border-bottom: 1px solid #f1f5f9;
  position: relative;
  padding-right: 1.8rem;
}
.session-item:hover { background: #f8fafc; }
.session-item.active { background: #fdf4ff; border-left: 3px solid #a855f7; padding-left: calc(.875rem - 3px); }
.session-title { font-size: .8rem; font-weight: 500; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.session-time { font-size: .7rem; color: #94a3b8; margin-top: .1rem; }
.session-item .btn-del {
  opacity: 0;
  position: absolute;
  right: .3rem; top: 50%;
  transform: translateY(-50%);
  background: none; border: none; padding: 2px 3px; line-height: 1;
  color: #94a3b8; cursor: pointer; border-radius: 3px; font-size: .85rem;
}
.session-item:hover .btn-del { opacity: 1; }
.session-item .btn-del:hover { background: #fee2e2; color: #dc2626; }
.kb-qa-main { margin-left: calc(var(--kb-sidebar-width) + 220px); }
/* 审核中气泡 */
.chat-bubble.pending {
  background: #fffbeb;
  border: 1px solid #fcd34d;
  color: #92400e;
}
.chat-bubble.pending .pending-badge {
  display: inline-flex;
  align-items: center;
  gap: .3rem;
  background: #fef3c7;
  border: 1px solid #fcd34d;
  border-radius: 99px;
  padding: .15rem .6rem;
  font-size: .72rem;
  font-weight: 600;
  color: #92400e;
  margin-bottom: .4rem;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
</head>
<body>

<nav class="kb-sidebar">
  <div class="brand"><i class="bi bi-headset me-2"></i>商城客服</div>
  <ul class="nav flex-column mt-2 flex-grow-1">
    <li><a class="nav-link active" href="/customer.html"><i class="bi bi-headset"></i>客户助手</a></li>
    <li><a class="nav-link" href="/reviews.html"><i class="bi bi-clipboard2-check"></i>审核中心</a></li>
  </ul>
  <div class="px-3 pb-2">
    <a href="/index.html" class="nav-link" style="font-size:.82rem;color:#c7d2fe"><i class="bi bi-house me-1"></i>返回首页</a>
  </div>
  <div class="p-3 border-top" style="border-color:#312e81!important">
    <small class="d-block text-truncate mb-2" id="sidebar-username"></small>
    <a href="#" onclick="logout()" style="color:#c7d2fe;font-size:.85rem"><i class="bi bi-box-arrow-right me-1"></i>退出</a>
  </div>
</nav>

<!-- Sessions panel -->
<div class="qa-sessions-sidebar">
  <div class="qa-sessions-header">
    <span>咨询记录</span>
    <button class="btn btn-sm py-0 px-2" id="btn-new-chat"
            style="font-size:.75rem;background:#a855f7;color:#fff;border:none">
      <i class="bi bi-plus me-1"></i>新咨询
    </button>
  </div>
  <div id="sessions-list"></div>
</div>

<div class="kb-main kb-qa-main d-flex flex-column" style="height:100vh">
  <div class="kb-topbar">
    <div class="d-flex align-items-center gap-3">
      <h6 class="mb-0 fw-bold"><i class="bi bi-headset me-2" style="color:#a855f7"></i>商城客户助手</h6>
      <span class="badge rounded-pill text-bg-light border" style="font-size:.72rem;font-weight:500">
        <i class="bi bi-circle-fill me-1" style="color:#22c55e;font-size:.5rem"></i>在线
      </span>
    </div>
    <div class="d-flex align-items-center gap-2">
      <select class="form-select form-select-sm" id="model-select" style="width:140px">
        <option value="">默认模型</option>
        <option value="MINIMAX">MiniMax</option>
        <option value="DASHSCOPE">DashScope</option>
        <option value="ANTHROPIC">Claude</option>
      </select>
    </div>
  </div>

  <!-- Chat area -->
  <div class="flex-grow-1 overflow-auto p-3" id="chat-messages" style="background:#f8fafc"></div>

  <!-- Input bar -->
  <div class="chat-input-bar">
    <div class="d-flex gap-2">
      <textarea class="form-control" id="question-input" rows="2"
                placeholder="请描述您的售后问题… (Enter 发送，Shift+Enter 换行)"
                style="resize:none"></textarea>
      <button class="btn px-3" id="btn-send" style="background:#a855f7;color:#fff;border:none">
        <i class="bi bi-send-fill"></i>
      </button>
    </div>
    <div class="d-flex align-items-center justify-content-between mt-1">
      <small class="text-muted">支持退款、换货、投诉等售后咨询，需提供订单号</small>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
requireAuth();
document.getElementById('sidebar-username').textContent = localStorage.getItem('username') || '';
marked.setOptions({ breaks: true, gfm: true });

let sessionId = null;
let activeSessionId = null;
let isSending = false;

// 判断是否是 HITL 审核中消息
function isPendingReview(text) {
  return text && (text.includes('审核') || text.includes('申请已提交') || text.includes('工作日内处理'));
}

// ---------- Session list ----------
async function refreshSessionList() {
  try {
    const res = await apiFetch('/after-sales/sessions');
    renderSessionList(res.data || []);
  } catch (e) {
    console.warn('加载咨询记录失败', e);
  }
}

function renderSessionList(sessions) {
  const list = document.getElementById('sessions-list');
  if (!sessions.length) {
    list.innerHTML = '<div class="text-center text-muted p-3" style="font-size:.78rem">暂无咨询记录</div>';
    return;
  }
  list.innerHTML = sessions.map(s => {
    const active = s.id === activeSessionId ? ' active' : '';
    return `<div class="session-item${active}" onclick="switchSession('${s.id}')">
      <button class="btn-del" onclick="deleteSession(event,'${s.id}')" title="删除"><i class="bi bi-x"></i></button>
      <div class="session-title">${escHtml(s.title)}</div>
      <div class="session-time">${formatTime(s.updatedAt || s.createdAt)}</div>
    </div>`;
  }).join('');
}

async function switchSession(id) {
  activeSessionId = id;
  sessionId = id;
  document.getElementById('chat-messages').innerHTML = '';
  document.querySelectorAll('.session-item').forEach(el => {
    el.classList.toggle('active', el.getAttribute('onclick') === `switchSession('${id}')`);
  });
  try {
    const res = await apiFetch(`/after-sales/sessions/${id}/messages`);
    const msgs = res.data || [];
    if (msgs.length) {
      msgs.forEach(m => addMessage(m.role, m.content));
    } else {
      addWelcome();
    }
  } catch (e) {
    addMessage('assistant', '加载历史消息失败：' + e.message);
  }
  document.getElementById('question-input').focus();
}

async function deleteSession(event, id) {
  event.stopPropagation();
  try {
    await apiFetch(`/after-sales/sessions/${id}`, { method: 'DELETE' });
  } catch (e) {
    showToast('删除失败：' + e.message, 'error');
    return;
  }
  if (activeSessionId === id) startNewChat();
  await refreshSessionList();
}

function startNewChat() {
  activeSessionId = null;
  sessionId = null;
  document.getElementById('chat-messages').innerHTML = '';
  addWelcome();
  document.getElementById('question-input').focus();
}

// ---------- Chat UI ----------
function addWelcome() {
  addMessage('assistant',
    '您好！我是商城客服助手，专门处理**退款、换货、投诉**等售后问题。\n\n请告诉我您的诉求，并提供**订单号**，我会为您查询并处理。');
}

function addMessage(role, content) {
  const container = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = `d-flex mb-3 ${role === 'user' ? 'justify-content-end' : 'justify-content-start'}`;

  const bubble = document.createElement('div');
  const pending = role === 'assistant' && isPendingReview(content);

  if (role === 'user') {
    bubble.className = 'chat-bubble user';
    bubble.textContent = content;
  } else if (pending) {
    bubble.className = 'chat-bubble pending';
    bubble.innerHTML = `<div class="pending-badge"><i class="bi bi-clock-history"></i>审核中</div>
      <div>${escHtml(content)}</div>`;
  } else {
    bubble.className = 'chat-bubble assistant';
    bubble.innerHTML = marked.parse(content);
  }

  div.appendChild(bubble);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return bubble;
}

function showTyping() {
  const container = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.id = 'typing-indicator';
  div.className = 'd-flex mb-3 justify-content-start';
  div.innerHTML = `<div class="chat-bubble assistant">
    <span class="spinner-grow spinner-grow-sm me-1" style="width:.5rem;height:.5rem"></span>
    <span class="spinner-grow spinner-grow-sm me-1" style="width:.5rem;height:.5rem;animation-delay:.15s"></span>
    <span class="spinner-grow spinner-grow-sm" style="width:.5rem;height:.5rem;animation-delay:.3s"></span>
  </div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}
function removeTyping() { document.getElementById('typing-indicator')?.remove(); }

// ---------- Send ----------
async function sendMessage() {
  const input = document.getElementById('question-input');
  const message = input.value.trim();
  if (!message || isSending) return;

  input.value = '';
  isSending = true;
  document.getElementById('btn-send').disabled = true;
  addMessage('user', message);
  showTyping();

  const modelProvider = document.getElementById('model-select').value || undefined;

  try {
    const res = await apiFetch('/after-sales/ask', {
      method: 'POST',
      body: JSON.stringify({ message, sessionId, modelProvider })
    });
    const data = res.data;
    removeTyping();
    addMessage('assistant', data.answer);
    sessionId = data.sessionId;
    activeSessionId = data.sessionId;
    await refreshSessionList();
  } catch (err) {
    removeTyping();
    addMessage('assistant', '抱歉，发生错误：' + err.message);
  } finally {
    isSending = false;
    document.getElementById('btn-send').disabled = false;
    input.focus();
  }
}

document.getElementById('btn-send').addEventListener('click', sendMessage);
document.getElementById('question-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('btn-new-chat').addEventListener('click', startNewChat);

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
  if (diff < 172800) return '昨天';
  return d.toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' });
}
function escHtml(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ---------- Init ----------
addWelcome();
refreshSessionList();
</script>
</body>
</html>
