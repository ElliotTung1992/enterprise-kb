<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 问答 — 企业知识库</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/app.css" rel="stylesheet">
<style>
body { visibility: hidden }
.qa-sessions-sidebar {
  position: fixed;
  left: var(--kb-sidebar-width);
  top: 0;
  width: 220px;
  height: 100vh;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  display: flex;
  flex-direction: column;
  z-index: 50;
  overflow: hidden;
}
.qa-sessions-header {
  padding: .65rem .875rem;
  font-size: .78rem;
  font-weight: 600;
  color: #64748b;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
  background: #f8fafc;
}
#sessions-list { overflow-y: auto; flex: 1; }
.session-item {
  padding: .55rem .875rem;
  cursor: pointer;
  border-bottom: 1px solid #f1f5f9;
  position: relative;
  padding-right: 1.8rem;
}
.session-item:hover { background: #f8fafc; }
.session-item.active { background: #eef2ff; border-left: 3px solid #4f46e5; padding-left: calc(.875rem - 3px); }
.session-title { font-size: .8rem; font-weight: 500; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.session-time { font-size: .7rem; color: #94a3b8; margin-top: .1rem; }
.session-item .btn-del {
  opacity: 0;
  position: absolute;
  right: .3rem; top: 50%;
  transform: translateY(-50%);
  background: none; border: none; padding: 2px 3px; line-height: 1;
  color: #94a3b8; cursor: pointer; border-radius: 3px; font-size: .85rem;
}
.session-item:hover .btn-del { opacity: 1; }
.session-item .btn-del:hover { background: #fee2e2; color: #dc2626; }
.kb-qa-main { margin-left: calc(var(--kb-sidebar-width) + 220px); }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
</head>
<body>

<nav class="kb-sidebar">
  <div class="brand"><i class="bi bi-journal-bookmark-fill me-2"></i>知识库</div>
  <ul class="nav flex-column mt-2 flex-grow-1">
    <li><a class="nav-link" href="/dashboard.html"><i class="bi bi-grid-1x2"></i>仪表盘</a></li>
    <li><a class="nav-link" href="/upload.html"><i class="bi bi-cloud-upload"></i>上传文档</a></li>
    <li><a class="nav-link" href="/search.html"><i class="bi bi-search"></i>搜索</a></li>
    <li><a class="nav-link active" href="/qa.html"><i class="bi bi-chat-dots"></i>AI 问答</a></li>
    <li><a class="nav-link" href="/tags.html"><i class="bi bi-tags"></i>标签管理</a></li>
  </ul>
  <div class="p-3 border-top" style="border-color:#312e81!important">
    <small class="d-block text-truncate mb-2" id="sidebar-username"></small>
    <a href="#" onclick="logout()" style="color:#c7d2fe;font-size:.85rem"><i class="bi bi-box-arrow-right me-1"></i>退出</a>
  </div>
</nav>

<!-- Sessions panel -->
<div class="qa-sessions-sidebar">
  <div class="qa-sessions-header">
    <span>会话记录</span>
    <button class="btn btn-primary btn-sm py-0 px-2" id="btn-new-chat" title="新对话" style="font-size:.75rem">
      <i class="bi bi-plus me-1"></i>新对话
    </button>
  </div>
  <div id="sessions-list"></div>
</div>

<div class="kb-main kb-qa-main d-flex flex-column" style="height:100vh">
  <div class="kb-topbar">
    <div class="d-flex align-items-center gap-3">
      <h6 class="mb-0 fw-bold"><i class="bi bi-chat-dots me-2 text-primary"></i>AI 问答</h6>
      <select class="form-select form-select-sm" id="space-select" style="width:160px"></select>
      <select class="form-select form-select-sm" id="model-select" style="width:140px">
        <option value="">默认模型</option>
        <option value="MINIMAX">MiniMax</option>
        <option value="OPENAI">GPT-4o</option>
        <option value="ANTHROPIC">Claude</option>
      </select>
    </div>
  </div>

  <!-- Chat area -->
  <div class="flex-grow-1 overflow-auto p-3" id="chat-messages" style="background:#f8fafc"></div>

  <!-- Citation panel -->
  <div id="citation-panel" class="px-4 pb-2 d-none">
    <div class="small fw-semibold text-muted mb-1"><i class="bi bi-link-45deg me-1"></i>引用来源</div>
    <div id="citation-list" class="d-flex gap-2 flex-wrap"></div>
  </div>

  <!-- Input bar -->
  <div class="chat-input-bar">
    <div class="d-flex gap-2">
      <textarea class="form-control" id="question-input" rows="2" placeholder="向知识库提问… (Enter 发送，Shift+Enter 换行)" style="resize:none"></textarea>
      <button class="btn btn-primary px-3" id="btn-send">
        <i class="bi bi-send-fill"></i>
      </button>
    </div>
    <div class="d-flex align-items-center justify-content-between mt-1">
      <small class="text-muted">使用知识库文档作为上下文回答</small>
      <div class="d-flex align-items-center gap-2">
        <label class="form-label mb-0 small text-muted">结果数</label>
        <select class="form-select form-select-sm" id="topk-select" style="width:70px">
          <option value="3">3</option>
          <option value="5" selected>5</option>
          <option value="10">10</option>
        </select>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
requireAuth();
document.getElementById('sidebar-username').textContent = localStorage.getItem('username') || '';

let sessionId = null;   // backend session ID (Redis key)
let isStreaming = false;
let activeSessionId = null;  // currently selected session (for highlight)

marked.setOptions({ breaks: true, gfm: true });

// ---------- Spaces ----------
async function loadSpaces() {
  const res = await apiFetch('/spaces');
  const spaces = res.data || [];
  const sel = document.getElementById('space-select');
  spaces.forEach(s => {
    const o = document.createElement('option');
    o.value = s.id; o.textContent = s.name; sel.appendChild(o);
  });
  const saved = localStorage.getItem('current_space_id');
  if (saved && spaces.find(s => s.id === saved)) sel.value = saved;
  else if (spaces.length) sel.value = spaces[0].id;
  if (sel.value) await refreshSessionList();
}

document.getElementById('space-select').addEventListener('change', async () => {
  startNewChat();
  await refreshSessionList();
});

// ---------- Session list (backend) ----------
async function refreshSessionList() {
  const spaceId = document.getElementById('space-select').value;
  if (!spaceId) return;
  try {
    const res = await apiFetch(`/spaces/${spaceId}/qa/sessions`);
    renderSessionList(res.data || []);
  } catch (e) {
    console.warn('加载会话列表失败', e);
  }
}

function renderSessionList(sessions) {
  const list = document.getElementById('sessions-list');
  if (!sessions.length) {
    list.innerHTML = '<div class="text-center text-muted p-3" style="font-size:.78rem">暂无会话记录</div>';
    return;
  }
  list.innerHTML = sessions.map(s => {
    const active = s.id === activeSessionId ? ' active' : '';
    return `<div class="session-item${active}" onclick="switchSession('${s.id}')">
      <button class="btn-del" onclick="deleteSession(event,'${s.id}')" title="删除"><i class="bi bi-x"></i></button>
      <div class="session-title">${escHtml(s.title)}</div>
      <div class="session-time">${formatTime(s.updatedAt || s.createdAt)}</div>
    </div>`;
  }).join('');
}

async function switchSession(id) {
  const spaceId = document.getElementById('space-select').value;
  if (!spaceId) return;
  activeSessionId = id;
  sessionId = id;
  document.getElementById('chat-messages').innerHTML = '';
  document.getElementById('citation-panel').classList.add('d-none');
  // 重新高亮
  document.querySelectorAll('.session-item').forEach(el => {
    el.classList.toggle('active', el.getAttribute('onclick') === `switchSession('${id}')`);
  });
  try {
    const res = await apiFetch(`/spaces/${spaceId}/qa/sessions/${id}/messages`);
    (res.data || []).forEach(m => addMessage(m.role, m.content, m.role === 'assistant'));
  } catch (e) {
    addMessage('assistant', '加载历史消息失败：' + e.message, false);
  }
  document.getElementById('question-input').focus();
}

async function deleteSession(event, id) {
  event.stopPropagation();
  const spaceId = document.getElementById('space-select').value;
  try {
    await apiFetch(`/spaces/${spaceId}/qa/sessions/${id}`, { method: 'DELETE' });
  } catch (e) {
    showToast('删除失败：' + e.message, 'error');
    return;
  }
  if (activeSessionId === id) startNewChat();
  await refreshSessionList();
}

function startNewChat() {
  activeSessionId = null;
  sessionId = null;
  document.getElementById('chat-messages').innerHTML = '';
  document.getElementById('citation-panel').classList.add('d-none');
  addMessage('assistant', '您好！我是知识库 AI 助手。请先选择一个空间，然后向我提问，我会基于知识库文档为您解答。', true);
  document.getElementById('question-input').focus();
}

// ---------- Chat UI ----------
function addMessage(role, content, isMarkdown = false) {
  const container = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = `d-flex mb-3 ${role === 'user' ? 'justify-content-end' : 'justify-content-start'}`;
  const bubble = document.createElement('div');
  bubble.className = `chat-bubble ${role}`;
  if (isMarkdown) bubble.innerHTML = marked.parse(content);
  else bubble.textContent = content;
  div.appendChild(bubble);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return bubble;
}

function showTyping() {
  const container = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.id = 'typing-indicator';
  div.className = 'd-flex mb-3 justify-content-start';
  div.innerHTML = `<div class="chat-bubble assistant">
    <span class="spinner-grow spinner-grow-sm me-1" style="width:.5rem;height:.5rem"></span>
    <span class="spinner-grow spinner-grow-sm me-1" style="width:.5rem;height:.5rem;animation-delay:.15s"></span>
    <span class="spinner-grow spinner-grow-sm" style="width:.5rem;height:.5rem;animation-delay:.3s"></span>
  </div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}
function removeTyping() { document.getElementById('typing-indicator')?.remove(); }

function showCitations(citations) {
  const panel = document.getElementById('citation-panel');
  const list = document.getElementById('citation-list');
  if (!citations || !citations.length) { panel.classList.add('d-none'); return; }
  panel.classList.remove('d-none');
  list.innerHTML = citations.map(c => `
    <div class="citation-card" title="${escHtml(c.excerpt || '')}">
      <div class="fw-semibold">${escHtml(c.documentTitle || '文档')}</div>
      ${c.pageNumber ? `<div class="text-muted">第 ${c.pageNumber} 页</div>` : ''}
      <div class="text-truncate" style="max-width:200px">${escHtml(c.excerpt || '')}</div>
    </div>`).join('');
}

// ---------- Send ----------
async function sendQuestion() {
  const spaceId = document.getElementById('space-select').value;
  if (!spaceId) { showToast('请先选择空间', 'error'); return; }
  const input = document.getElementById('question-input');
  const question = input.value.trim();
  if (!question || isStreaming) return;

  input.value = '';
  isStreaming = true;
  document.getElementById('btn-send').disabled = true;
  document.getElementById('citation-panel').classList.add('d-none');
  addMessage('user', question);
  showTyping();

  const modelProvider = document.getElementById('model-select').value || undefined;
  const topK = parseInt(document.getElementById('topk-select').value);

  try {
    const res = await apiFetch(`/spaces/${spaceId}/qa/ask`, {
      method: 'POST',
      body: JSON.stringify({ question, sessionId, modelProvider, topK })
    });
    const data = res.data;
    removeTyping();
    addMessage('assistant', data.answer, true);
    showCitations(data.citations);
    // 后端已持久化会话，刷新侧边栏并记录当前 sessionId
    sessionId = data.sessionId;
    activeSessionId = data.sessionId;
    await refreshSessionList();
  } catch (err) {
    removeTyping();
    addMessage('assistant', '抱歉，发生错误：' + err.message);
  } finally {
    isStreaming = false;
    document.getElementById('btn-send').disabled = false;
    input.focus();
  }
}

document.getElementById('btn-send').addEventListener('click', sendQuestion);
document.getElementById('question-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
});
document.getElementById('btn-new-chat').addEventListener('click', startNewChat);

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
  if (diff < 172800) return '昨天';
  return d.toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' });
}
function escHtml(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ---------- Init ----------
addMessage('assistant', '您好！我是知识库 AI 助手。请先选择一个空间，然后向我提问，我会基于知识库文档为您解答。', true);
loadSpaces();
</script>
</body>
</html>
