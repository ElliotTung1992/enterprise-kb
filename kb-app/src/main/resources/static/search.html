<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搜索 — 企业知识库</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/app.css" rel="stylesheet">
<style>body{visibility:hidden}.search-hit{cursor:default}.excerpt-full{display:none;white-space:pre-wrap}.hit-expanded .excerpt-short{display:none}.hit-expanded .excerpt-full{display:block}</style>
</head>
<body>

<nav class="kb-sidebar">
  <div class="brand"><i class="bi bi-journal-bookmark-fill me-2"></i>知识库</div>
  <ul class="nav flex-column mt-2 flex-grow-1">
    <li><a class="nav-link" href="/dashboard.html"><i class="bi bi-grid-1x2"></i>仪表盘</a></li>
    <li><a class="nav-link" href="/upload.html"><i class="bi bi-cloud-upload"></i>上传文档</a></li>
    <li><a class="nav-link active" href="/search.html"><i class="bi bi-search"></i>搜索</a></li>
    <li><a class="nav-link" href="/qa.html"><i class="bi bi-chat-dots"></i>AI 问答</a></li>
    <li><a class="nav-link" href="/tags.html"><i class="bi bi-tags"></i>标签管理</a></li>
  </ul>
  <div class="p-3 border-top" style="border-color:#312e81!important">
    <small class="d-block text-truncate mb-2" id="sidebar-username"></small>
    <a href="#" onclick="logout()" style="color:#c7d2fe;font-size:.85rem"><i class="bi bi-box-arrow-right me-1"></i>退出</a>
  </div>
</nav>

<div class="kb-main">
  <div class="kb-topbar">
    <h6 class="mb-0 fw-bold"><i class="bi bi-search me-2 text-primary"></i>文档搜索</h6>
    <select class="form-select form-select-sm" id="space-select" style="width:200px"></select>
  </div>

  <div class="p-4">
    <!-- Search bar -->
    <div class="kb-card mb-4">
      <div class="d-flex gap-2 mb-3">
        <input type="text" class="form-control" id="search-input" placeholder="输入搜索关键词或自然语言查询…" autofocus>
        <button class="btn btn-search" id="btn-search"><i class="bi bi-search me-2"></i>搜索</button>
      </div>
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <span class="fw-semibold small text-muted">搜索模式：</span>
        <div class="btn-group btn-group-sm" role="group">
          <input type="radio" class="btn-check" name="mode" id="mode-hybrid" value="hybrid" checked>
          <label class="btn btn-outline-primary" for="mode-hybrid"><i class="bi bi-lightning me-1"></i>混合</label>
          <input type="radio" class="btn-check" name="mode" id="mode-semantic" value="semantic">
          <label class="btn btn-outline-primary" for="mode-semantic"><i class="bi bi-stars me-1"></i>语义</label>
          <input type="radio" class="btn-check" name="mode" id="mode-keyword" value="keyword">
          <label class="btn btn-outline-primary" for="mode-keyword"><i class="bi bi-type me-1"></i>关键词</label>
        </div>
        <select class="form-select form-select-sm" id="topk-select" style="width:90px">
          <option value="5">Top 5</option>
          <option value="10" selected>Top 10</option>
          <option value="20">Top 20</option>
        </select>
        <span class="text-muted small" id="search-meta"></span>
      </div>
    </div>

    <div class="row g-3">
      <!-- Results -->
      <div class="col-lg-8">
        <div id="results-container">
          <div class="text-center text-muted py-5">
            <i class="bi bi-search fs-1 text-muted opacity-25 d-block mb-2"></i>
            输入关键词开始搜索
          </div>
        </div>
      </div>

      <!-- Filters -->
      <div class="col-lg-4">
        <div class="kb-card">
          <h6 class="fw-bold mb-3"><i class="bi bi-funnel me-1"></i>筛选</h6>
          <div class="mb-3">
            <label class="form-label small fw-semibold">AI 模型</label>
            <select class="form-select form-select-sm" id="model-select">
              <option value="">默认</option>
              <option value="MINIMAX">MiniMax</option>
              <option value="OPENAI">OpenAI</option>
              <option value="ANTHROPIC">Anthropic</option>
              <option value="DASHSCOPE">DashScope</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">文件类型</label>
            <div class="d-flex flex-wrap gap-1" id="type-filters">
              <button class="btn btn-xs btn-outline-secondary active" data-mime="">全部</button>
              <button class="btn btn-xs btn-outline-danger" data-mime="pdf"><i class="bi bi-file-earmark-pdf me-1"></i>PDF</button>
              <button class="btn btn-xs btn-outline-primary" data-mime="word"><i class="bi bi-file-earmark-word me-1"></i>Word</button>
              <button class="btn btn-xs btn-outline-success" data-mime="markdown"><i class="bi bi-file-earmark-code me-1"></i>MD</button>
              <button class="btn btn-xs btn-outline-secondary" data-mime="plain"><i class="bi bi-file-earmark-text me-1"></i>TXT</button>
              <button class="btn btn-xs btn-outline-warning" data-mime="html"><i class="bi bi-file-earmark-code me-1"></i>HTML</button>
            </div>
          </div>
          <div class="mb-0">
            <label class="form-label small fw-semibold">快速跳转</label>
            <a href="/qa.html" class="btn btn-sm btn-outline-primary w-100">
              <i class="bi bi-chat-dots me-1"></i>切换到 AI 问答
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
requireAuth();
document.getElementById('sidebar-username').textContent = localStorage.getItem('username') || '';

// Restore persisted model selection
const savedModel = localStorage.getItem('search_model') || '';
document.getElementById('model-select').value = savedModel;
document.getElementById('model-select').addEventListener('change', e => {
  localStorage.setItem('search_model', e.target.value);
});

let activeMimeFilter = '';

// File type filter buttons
document.getElementById('type-filters').addEventListener('click', e => {
  const btn = e.target.closest('[data-mime]');
  if (!btn) return;
  activeMimeFilter = btn.dataset.mime;
  document.querySelectorAll('#type-filters [data-mime]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  // Re-render if results exist
  if (lastResults) renderResults(lastResults);
});

async function loadSpaces() {
  const res = await apiFetch('/spaces');
  const spaces = res.data || [];
  const sel = document.getElementById('space-select');
  spaces.forEach(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = s.name; sel.appendChild(o); });
  const saved = localStorage.getItem('current_space_id');
  if (saved && spaces.find(s => s.id === saved)) sel.value = saved;
  else if (spaces.length) sel.value = spaces[0].id;
  sel.addEventListener('change', () => setCurrentSpace(sel.value, sel.options[sel.selectedIndex].text));
}

let lastResults = null;

async function doSearch() {
  const spaceId = document.getElementById('space-select').value;
  if (!spaceId) { showToast('请先选择空间', 'error'); return; }
  const query = document.getElementById('search-input').value.trim();
  if (!query) return;
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const topK = parseInt(document.getElementById('topk-select').value);
  const modelProvider = document.getElementById('model-select').value || undefined;

  const container = document.getElementById('results-container');
  container.innerHTML = '<div class="text-center py-4"><span class="spinner-border text-primary"></span></div>';
  document.getElementById('search-meta').textContent = '';

  try {
    const endpoint = mode === 'hybrid' ? '/search/hybrid' : mode === 'keyword' ? '/search/keyword' : '/search';
    const res = await apiFetch(`/spaces/${spaceId}${endpoint}`, {
      method: 'POST',
      body: JSON.stringify({ query, topK, modelProvider })
    });
    lastResults = res.data;
    renderResults(res.data);
  } catch (err) {
    container.innerHTML = `<div class="alert alert-danger">${escHtml(err.message)}</div>`;
  }
}

function renderResults(data) {
  let hits = data?.hits || [];
  // Client-side mime filter
  if (activeMimeFilter) {
    hits = hits.filter(h => (h.mimeType || '').includes(activeMimeFilter));
  }
  const total = data?.hits?.length || 0;
  const shown = hits.length;
  document.getElementById('search-meta').textContent =
    total ? `${shown}/${total} 条结果 · ${data.durationMs}ms` : '';

  const container = document.getElementById('results-container');
  if (!hits.length) {
    container.innerHTML = '<div class="text-muted text-center py-4">未找到相关内容</div>';
    return;
  }

  container.innerHTML = hits.map((h, idx) => `
    <div class="search-hit mb-3" id="hit-${idx}">
      <div class="d-flex align-items-start justify-content-between mb-1">
        <span class="fw-semibold text-truncate" style="max-width:70%">${escHtml(h.documentTitle || '未知文档')}</span>
        <div class="d-flex align-items-center gap-2 ms-2 flex-shrink-0">
          <span class="score-badge">${(h.score * 100).toFixed(0)}%</span>
          <button class="btn btn-xs btn-outline-secondary" title="复制内容" onclick="copyExcerpt(${idx})">
            <i class="bi bi-copy" style="font-size:.75rem"></i>
          </button>
        </div>
      </div>
      ${h.pageNumber ? `<small class="text-muted me-2"><i class="bi bi-file-earmark me-1"></i>第 ${h.pageNumber} 页</small>` : ''}
      ${h.section ? `<small class="text-muted me-2"><i class="bi bi-hash me-1"></i>${escHtml(h.section)}</small>` : ''}
      <p class="text-secondary small mb-1 mt-1 excerpt-short">${escHtml((h.excerpt || '').slice(0, 200))}${(h.excerpt||'').length > 200 ? '…' : ''}</p>
      ${(h.excerpt||'').length > 200 ? `
        <pre class="text-secondary small mb-1 excerpt-full" style="font-family:inherit">${escHtml(h.excerpt||'')}</pre>
        <a href="#" class="small text-primary toggle-excerpt" onclick="toggleExcerpt(${idx});return false;">展开全文</a>` : ''}
      <div id="copy-toast-${idx}" class="text-success small d-none">已复制</div>
    </div>`).join('');
}

function toggleExcerpt(idx) {
  const hit = document.getElementById(`hit-${idx}`);
  const isExpanded = hit.classList.toggle('hit-expanded');
  hit.querySelector('.toggle-excerpt').textContent = isExpanded ? '收起' : '展开全文';
}

function copyExcerpt(idx) {
  const hit = document.getElementById(`hit-${idx}`);
  const text = hit.querySelector('.excerpt-full')?.textContent || hit.querySelector('.excerpt-short')?.textContent || '';
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById(`copy-toast-${idx}`);
    toast.classList.remove('d-none');
    setTimeout(() => toast.classList.add('d-none'), 1500);
  });
}

document.getElementById('btn-search').addEventListener('click', doSearch);
document.getElementById('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

loadSpaces();
</script>
</body>
</html>
