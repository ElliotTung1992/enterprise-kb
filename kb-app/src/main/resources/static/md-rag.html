<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown RAG — 企业知识库</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/app.css" rel="stylesheet">
<style>
body { visibility: hidden }
.md-layout { display: grid; grid-template-columns: 360px 1fr; gap: 1rem; height: calc(100vh - 64px); }
.md-panel { background: #fff; border-right: 1px solid #e2e8f0; overflow: auto; }
.md-chat { display: flex; flex-direction: column; min-height: 0; }
.md-messages { flex: 1; overflow: auto; background: #f8fafc; padding: 1rem; }
.md-upload-zone { border: 2px dashed #a5b4fc; border-radius: 8px; padding: 1.5rem; text-align: center; cursor: pointer; }
.md-upload-zone:hover { background: #eef2ff; border-color: var(--kb-primary); }
.md-doc-item { padding: .65rem .25rem; border-bottom: 1px solid #f1f5f9; }
.md-doc-title { font-size: .84rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.md-mode { width: 150px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
</head>
<body>

<nav class="kb-sidebar">
  <div class="brand"><i class="bi bi-journal-bookmark-fill me-2"></i>知识库</div>
  <ul class="nav flex-column mt-2 flex-grow-1">
    <li><a class="nav-link" href="/dashboard.html"><i class="bi bi-grid-1x2"></i>仪表盘</a></li>
    <li><a class="nav-link" href="/upload.html"><i class="bi bi-cloud-upload"></i>上传文档</a></li>
    <li><a class="nav-link" href="/search.html"><i class="bi bi-search"></i>搜索</a></li>
    <li><a class="nav-link" href="/qa.html"><i class="bi bi-chat-dots"></i>AI 问答</a></li>
    <li><a class="nav-link active" href="/md-rag.html"><i class="bi bi-markdown"></i>Markdown RAG</a></li>
    <li><a class="nav-link" href="/tags.html"><i class="bi bi-tags"></i>标签管理</a></li>
  </ul>
  <div class="p-3 border-top" style="border-color:#312e81!important">
    <small class="d-block text-truncate mb-2" id="sidebar-username"></small>
    <a href="/index.html" style="color:#c7d2fe;font-size:.82rem;display:block;margin-bottom:.4rem"><i class="bi bi-house me-1"></i>返回首页</a>
    <a href="#" onclick="logout()" style="color:#c7d2fe;font-size:.85rem"><i class="bi bi-box-arrow-right me-1"></i>退出</a>
  </div>
</nav>

<div class="kb-main">
  <div class="kb-topbar">
    <h6 class="mb-0 fw-bold"><i class="bi bi-markdown me-2 text-primary"></i>Markdown 结构化 RAG</h6>
    <div class="d-flex align-items-center gap-2">
      <select class="form-select form-select-sm" id="space-select" style="width:180px"></select>
      <select class="form-select form-select-sm md-mode" id="qa-mode">
        <option value="standard">标准问答</option>
        <option value="agentic">Agentic</option>
      </select>
    </div>
  </div>

  <div class="md-layout">
    <aside class="md-panel p-3">
      <div class="md-upload-zone" id="upload-zone">
        <i class="bi bi-filetype-md d-block fs-2 text-primary mb-2"></i>
        <div class="fw-semibold">选择 .md 文件</div>
        <div class="text-muted small">走独立 Markdown 竖井入库</div>
        <input type="file" id="file-input" accept=".md,.markdown" class="d-none">
      </div>
      <button class="btn btn-primary w-100 mt-3" id="btn-upload" disabled>
        <i class="bi bi-upload me-1"></i>上传并入库
      </button>
      <div class="d-flex align-items-center justify-content-between mt-4 mb-2">
        <div class="fw-bold small">Markdown 文档</div>
        <button class="btn btn-sm btn-outline-secondary" id="btn-refresh" title="刷新">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
      </div>
      <div id="doc-list"></div>
    </aside>

    <main class="md-chat">
      <div class="md-messages" id="chat-messages"></div>
      <div id="citation-panel" class="px-3 py-2 bg-white border-top d-none">
        <div class="small fw-semibold text-muted mb-1"><i class="bi bi-link-45deg me-1"></i>引用 section</div>
        <div id="citation-list" class="d-flex gap-2 flex-wrap"></div>
      </div>
      <div class="chat-input-bar">
        <div class="d-flex gap-2">
          <textarea class="form-control" id="question-input" rows="2" placeholder="向 Markdown 知识库提问..." style="resize:none"></textarea>
          <button class="btn btn-primary px-3" id="btn-send"><i class="bi bi-send-fill"></i></button>
        </div>
        <div class="d-flex align-items-center justify-content-between mt-1">
          <small class="text-muted">标准问答会先 child 召回再展开 parent；Agentic 会按需读取完整 section</small>
          <select class="form-select form-select-sm" id="topk-select" style="width:76px">
            <option value="3">3</option>
            <option value="5" selected>5</option>
            <option value="10">10</option>
          </select>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
requireAuth();
document.getElementById('sidebar-username').textContent = localStorage.getItem('username') || '';
marked.setOptions({ breaks: true, gfm: true });

let selectedFile = null;
let sessionId = null;
let sending = false;

async function loadSpaces() {
  const res = await apiFetch('/spaces');
  const spaces = res.data || [];
  const sel = document.getElementById('space-select');
  sel.innerHTML = '';
  spaces.forEach(s => {
    const option = document.createElement('option');
    option.value = s.id;
    option.textContent = s.name;
    sel.appendChild(option);
  });
  const saved = localStorage.getItem('current_space_id');
  if (saved && spaces.find(s => s.id === saved)) sel.value = saved;
  else if (spaces.length) sel.value = spaces[0].id;
  if (sel.value) await loadDocuments();
}

async function loadDocuments() {
  const spaceId = document.getElementById('space-select').value;
  if (!spaceId) return;
  const res = await apiFetch(`/spaces/${spaceId}/md-documents?size=50`);
  const docs = res.data?.content || [];
  const list = document.getElementById('doc-list');
  if (!docs.length) {
    list.innerHTML = '<div class="text-muted text-center py-4 small">暂无 Markdown 文档</div>';
    return;
  }
  list.innerHTML = docs.map(d => `
    <div class="md-doc-item">
      <div class="d-flex align-items-center justify-content-between gap-2">
        <div class="md-doc-title" title="${escHtml(d.title)}">${escHtml(d.title)}</div>
        <span class="badge ${statusClass(d.status)}">${statusText(d.status)}</span>
      </div>
      <div class="text-muted small mt-1">${d.chunkCount || 0} chunks</div>
    </div>`).join('');
}

document.getElementById('space-select').addEventListener('change', () => {
  const sel = document.getElementById('space-select');
  setCurrentSpace(sel.value, sel.options[sel.selectedIndex]?.text || '');
  sessionId = null;
  loadDocuments();
});

document.getElementById('upload-zone').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change', e => {
  selectedFile = e.target.files[0] || null;
  document.getElementById('btn-upload').disabled = !selectedFile;
  document.querySelector('#upload-zone .fw-semibold').textContent = selectedFile ? selectedFile.name : '选择 .md 文件';
});

document.getElementById('btn-upload').addEventListener('click', async () => {
  const spaceId = document.getElementById('space-select').value;
  if (!spaceId || !selectedFile) return;
  const form = new FormData();
  form.append('file', selectedFile);
  document.getElementById('btn-upload').disabled = true;
  try {
    await apiFetch(`/spaces/${spaceId}/md-documents/upload`, { method: 'POST', body: form });
    showToast('Markdown 已提交入库');
    selectedFile = null;
    document.getElementById('file-input').value = '';
    document.querySelector('#upload-zone .fw-semibold').textContent = '选择 .md 文件';
    await loadDocuments();
  } catch (e) {
    showToast('上传失败：' + e.message, 'error');
  } finally {
    document.getElementById('btn-upload').disabled = !selectedFile;
  }
});

document.getElementById('btn-refresh').addEventListener('click', loadDocuments);

async function sendQuestion() {
  const spaceId = document.getElementById('space-select').value;
  const questionInput = document.getElementById('question-input');
  const question = questionInput.value.trim();
  if (!spaceId || !question || sending) return;
  sending = true;
  questionInput.value = '';
  document.getElementById('btn-send').disabled = true;
  document.getElementById('citation-panel').classList.add('d-none');
  addMessage('user', question);
  const typing = addMessage('assistant', '正在检索 Markdown section...', false);
  const endpoint = document.getElementById('qa-mode').value === 'agentic' ? 'ask/agentic' : 'ask';
  const topK = parseInt(document.getElementById('topk-select').value);
  try {
    const res = await apiFetch(`/spaces/${spaceId}/md-qa/${endpoint}`, {
      method: 'POST',
      body: JSON.stringify({ question, sessionId, topK })
    });
    const data = res.data;
    sessionId = data.sessionId;
    typing.innerHTML = marked.parse(data.answer || '');
    showCitations(data.citations || []);
  } catch (e) {
    typing.textContent = '问答失败：' + e.message;
  } finally {
    sending = false;
    document.getElementById('btn-send').disabled = false;
    questionInput.focus();
  }
}

document.getElementById('btn-send').addEventListener('click', sendQuestion);
document.getElementById('question-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
});

function addMessage(role, content, markdown = true) {
  const container = document.getElementById('chat-messages');
  const row = document.createElement('div');
  row.className = `d-flex mb-3 ${role === 'user' ? 'justify-content-end' : 'justify-content-start'}`;
  const bubble = document.createElement('div');
  bubble.className = `chat-bubble ${role}`;
  if (markdown && role !== 'user') bubble.innerHTML = marked.parse(content);
  else bubble.textContent = content;
  row.appendChild(bubble);
  container.appendChild(row);
  container.scrollTop = container.scrollHeight;
  return bubble;
}

function showCitations(citations) {
  const panel = document.getElementById('citation-panel');
  const list = document.getElementById('citation-list');
  if (!citations.length) {
    panel.classList.add('d-none');
    return;
  }
  panel.classList.remove('d-none');
  list.innerHTML = citations.map(c => `
    <div class="citation-card" title="${escHtml(c.excerpt || '')}">
      <div class="fw-semibold">${escHtml(c.documentTitle || 'Markdown 文档')}</div>
      <div class="text-muted text-truncate" style="max-width:220px">${escHtml(c.section || c.excerpt || '')}</div>
    </div>`).join('');
}

function statusClass(status) {
  return { PENDING: 'badge-pending', PROCESSING: 'badge-processing', READY: 'badge-ready', FAILED: 'badge-failed' }[status] || 'bg-secondary';
}
function statusText(status) {
  return { PENDING: '待处理', PROCESSING: '处理中', READY: '就绪', FAILED: '失败' }[status] || status;
}
function escHtml(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

addMessage('assistant', '这里是独立的 Markdown RAG 页面，只调用 `/md-documents` 和 `/md-qa`。');
loadSpaces();
</script>
</body>
</html>
