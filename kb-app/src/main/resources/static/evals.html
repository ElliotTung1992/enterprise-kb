<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eval 管理 — 企业知识库</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/app.css" rel="stylesheet">
<style>
body { visibility:hidden; }
.workbench { display:grid; grid-template-columns: 380px 1fr; gap:1rem; }
.case-list { border:1px solid #e2e8f0; border-radius:8px; background:#fff; overflow:hidden; }
.case-row { padding:.75rem .9rem; border-bottom:1px solid #f1f5f9; cursor:pointer; }
.case-row:hover { background:#f8fafc; }
textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.82rem; }
.json-box { background:#0f172a; color:#e2e8f0; border-radius:8px; padding:1rem; min-height:180px; overflow:auto; font-size:.78rem; }
@media (max-width:900px) { .workbench { grid-template-columns:1fr; } }
</style>
</head>
<body>
<nav class="kb-sidebar">
  <div class="brand"><i class="bi bi-clipboard-data me-2"></i>Eval 后台</div>
  <ul class="nav flex-column mt-2 flex-grow-1">
    <li><a class="nav-link" href="/traces.html"><i class="bi bi-list-nested"></i>Trace</a></li>
    <li><a class="nav-link active" href="/evals.html"><i class="bi bi-clipboard-data"></i>Eval</a></li>
    <li><a class="nav-link" href="/reviews.html"><i class="bi bi-clipboard2-check"></i>审核中心</a></li>
  </ul>
  <div class="px-3 pb-2"><a href="/index.html" class="nav-link" style="font-size:.82rem;color:#c7d2fe"><i class="bi bi-house me-1"></i>返回首页</a></div>
  <div class="p-3 border-top" style="border-color:#312e81!important">
    <small class="d-block text-truncate mb-2" id="sidebar-username"></small>
    <a href="#" onclick="logout()" style="color:#c7d2fe;font-size:.85rem"><i class="bi bi-box-arrow-right me-1"></i>退出</a>
  </div>
</nav>
<main class="kb-main">
  <div class="kb-topbar">
    <h6 class="mb-0 fw-bold"><i class="bi bi-clipboard-data me-2 text-primary"></i>Eval 管理</h6>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-outline-primary" onclick="runEval()"><i class="bi bi-play-fill"></i></button>
      <button class="btn btn-sm btn-primary" onclick="saveCase()"><i class="bi bi-save"></i></button>
    </div>
  </div>
  <section class="p-4">
    <div class="filter-bar mb-3">
      <input class="form-control form-control-sm" id="dataset" value="draft" style="max-width:160px">
      <input class="form-control form-control-sm" id="case-type-filter" placeholder="caseType" style="max-width:160px">
      <button class="btn btn-sm btn-outline-primary" onclick="loadCases()"><i class="bi bi-search"></i></button>
      <a class="btn btn-sm btn-outline-secondary" id="export-link" href="/api/v1/admin/eval-cases/export-jsonl?dataset=draft"><i class="bi bi-download"></i></a>
    </div>
    <div class="workbench">
      <div class="case-list" id="case-list"></div>
      <div>
        <div class="row g-2 mb-2">
          <div class="col"><input class="form-control form-control-sm" id="case-name" placeholder="name"></div>
          <div class="col"><input class="form-control form-control-sm" id="case-type" placeholder="ANSWER"></div>
          <div class="col-auto"><label class="form-check mt-1"><input class="form-check-input" type="checkbox" id="case-enabled"> 启用</label></div>
        </div>
        <label class="form-label small text-muted">inputJson</label>
        <textarea class="form-control mb-2" id="input-json" rows="5">{}</textarea>
        <label class="form-label small text-muted">expectedJson</label>
        <textarea class="form-control mb-2" id="expected-json" rows="5">{"mustContain":[]}</textarea>
        <label class="form-label small text-muted">mockOutputsJson</label>
        <textarea class="form-control mb-3" id="mock-json" rows="4">{}</textarea>
        <h6>最近运行</h6>
        <pre class="json-box" id="run-box">{}</pre>
      </div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/api.js"></script>
<script>
requireAuth();
document.getElementById('sidebar-username').textContent = localStorage.getItem('username') || '';
let selected = null;

async function loadCases() {
  const dataset = document.getElementById('dataset').value.trim();
  const caseType = document.getElementById('case-type-filter').value.trim();
  const params = new URLSearchParams();
  if (dataset) params.set('dataset', dataset);
  if (caseType) params.set('caseType', caseType);
  document.getElementById('export-link').href = '/api/v1/admin/eval-cases/export-jsonl?dataset=' + encodeURIComponent(dataset);
  const res = await apiFetch('/admin/eval-cases?' + params.toString());
  renderCases(res.data || []);
}

function renderCases(cases) {
  document.getElementById('case-list').innerHTML = cases.map(c => `
    <div class="case-row" onclick='selectCase(${JSON.stringify(c).replaceAll("'", "&#39;")})'>
      <div class="fw-semibold">${c.name}</div>
      <div class="small text-muted">${c.caseType} · ${c.dataset} · ${c.enabled ? 'enabled' : 'disabled'}</div>
    </div>`).join('') || '<div class="p-4 text-muted">暂无 Eval Case</div>';
}

function selectCase(c) {
  selected = c;
  document.getElementById('case-name').value = c.name || '';
  document.getElementById('case-type').value = c.caseType || 'ANSWER';
  document.getElementById('case-enabled').checked = !!c.enabled;
  document.getElementById('input-json').value = c.inputJson || '{}';
  document.getElementById('expected-json').value = c.expectedJson || '{"mustContain":[]}';
  document.getElementById('mock-json').value = c.mockOutputsJson || '{}';
}

async function saveCase() {
  const body = {
    ...(selected || {}),
    name: document.getElementById('case-name').value.trim(),
    dataset: document.getElementById('dataset').value.trim() || 'draft',
    caseType: document.getElementById('case-type').value.trim() || 'ANSWER',
    enabled: document.getElementById('case-enabled').checked,
    inputJson: document.getElementById('input-json').value,
    expectedJson: document.getElementById('expected-json').value,
    mockOutputsJson: document.getElementById('mock-json').value
  };
  const path = selected ? '/admin/eval-cases/' + selected.id : '/admin/eval-cases';
  const method = selected ? 'PUT' : 'POST';
  await apiFetch(path, { method, body: JSON.stringify(body) });
  showToast('已保存');
  await loadCases();
}

async function runEval() {
  const dataset = document.getElementById('dataset').value.trim() || 'draft';
  const res = await apiFetch('/admin/eval-runs', { method:'POST', body: JSON.stringify({ dataset }) });
  const detail = await apiFetch('/admin/eval-runs/' + res.data.id);
  document.getElementById('run-box').textContent = JSON.stringify(detail.data, null, 2);
}

loadCases().catch(e => showToast(e.message, 'error'));
</script>
</body>
</html>
