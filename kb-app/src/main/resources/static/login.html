<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 — 企业知识库</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body { background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card { background: #fff; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .brand-logo { font-size: 2rem; color: #4f46e5; }
  .btn-login { background: #4f46e5; border: none; }
  .btn-login:hover { background: #4338ca; }
</style>
</head>
<body>
<div class="login-card">
  <div class="text-center mb-4">
    <i class="bi bi-journal-bookmark-fill brand-logo"></i>
    <h4 class="mt-2 fw-bold">企业知识库</h4>
    <p class="text-muted small">Enterprise Knowledge Base</p>
  </div>

  <div id="alert-box" class="alert alert-danger d-none"></div>

  <form id="login-form">
    <div class="mb-3">
      <label class="form-label fw-semibold">用户名</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input type="text" id="username" class="form-control" placeholder="输入用户名" required autofocus>
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">密码</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" id="password" class="form-control" placeholder="输入密码" required>
        <button type="button" class="btn btn-outline-secondary" id="toggle-pwd">
          <i class="bi bi-eye"></i>
        </button>
      </div>
    </div>
    <button type="submit" class="btn btn-login btn-primary w-100 py-2 fw-semibold" id="btn-submit">
      <span id="btn-text">登录</span>
      <span id="btn-spinner" class="spinner-border spinner-border-sm d-none ms-1"></span>
    </button>
  </form>

  <hr class="my-3">
  <p class="text-center text-muted small mb-0">
    还没有账号？<a href="/register.html">立即注册</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
  // Redirect if already logged in
  if (localStorage.getItem('access_token')) window.location.href = '/dashboard.html';

  document.getElementById('toggle-pwd').addEventListener('click', () => {
    const pwd = document.getElementById('password');
    const icon = document.querySelector('#toggle-pwd i');
    if (pwd.type === 'password') { pwd.type = 'text'; icon.className = 'bi bi-eye-slash'; }
    else { pwd.type = 'password'; icon.className = 'bi bi-eye'; }
  });

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const alertBox = document.getElementById('alert-box');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');

    btnText.textContent = '登录中…';
    btnSpinner.classList.remove('d-none');
    alertBox.classList.add('d-none');

    try {
      await login(username, password);
      window.location.href = '/dashboard.html';
    } catch (err) {
      alertBox.textContent = err.message;
      alertBox.classList.remove('d-none');
    } finally {
      btnText.textContent = '登录';
      btnSpinner.classList.add('d-none');
    }
  });
</script>
</body>
</html>
