<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic 流式问答 — 企业知识库</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/app.css" rel="stylesheet">
<style>
  body{visibility:hidden}
  .agent-steps{margin-bottom:.4rem}
  .agent-step{font-size:.82rem;color:#475569;padding:.15rem 0;display:flex;gap:.4rem;align-items:baseline}
  .agent-step-result{font-size:.78rem}
  .agent-thinking{margin:.3rem 0 .5rem;border-left:3px solid #cbd5e1;background:#f8fafc;border-radius:4px}
  .agent-thinking-summary{cursor:pointer;font-size:.8rem;color:#64748b;padding:.3rem .5rem;user-select:none}
  .agent-thinking-body{white-space:pre-wrap;font-size:.8rem;color:#64748b;padding:.1rem .6rem .5rem}
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
</head>
<body>

<nav class="kb-sidebar">
  <div class="brand"><i class="bi bi-journal-bookmark-fill me-2"></i>知识库</div>
  <ul class="nav flex-column mt-2 flex-grow-1">
    <li><a class="nav-link" href="/dashboard.html"><i class="bi bi-grid-1x2"></i>仪表盘</a></li>
    <li><a class="nav-link" href="/md-upload.html"><i class="bi bi-cloud-upload"></i>Markdown 上传</a></li>
    <li><a class="nav-link" href="/md-qa-standard.html"><i class="bi bi-chat-square-text"></i>标准问答</a></li>
    <li><a class="nav-link" href="/md-qa-agentic.html"><i class="bi bi-diagram-3"></i>Agentic 问答</a></li>
    <li><a class="nav-link" href="/md-qa-stream.html"><i class="bi bi-broadcast"></i>流式问答</a></li>
    <li><a class="nav-link active" href="/md-qa-agentic-stream.html"><i class="bi bi-stars"></i>Agentic 流式</a></li>
  </ul>
  <div class="p-3 border-top" style="border-color:#312e81!important">
    <small class="d-block text-truncate mb-2" id="sidebar-username"></small>
    <a href="/index.html" style="color:#c7d2fe;font-size:.82rem;display:block;margin-bottom:.4rem"><i class="bi bi-house me-1"></i>返回首页</a>
    <a href="#" onclick="logout()" style="color:#c7d2fe;font-size:.85rem"><i class="bi bi-box-arrow-right me-1"></i>退出</a>
  </div>
</nav>

<div class="qa-sessions-sidebar">
  <div class="qa-sessions-header">
    <span>问答记录</span>
    <button class="btn btn-sm btn-primary py-0 px-2" id="btn-new-chat" style="font-size:.75rem">
      <i class="bi bi-plus me-1"></i>新会话
    </button>
  </div>
  <div id="sessions-list"></div>
</div>

<div class="kb-main kb-qa-main">
  <div class="kb-topbar">
    <h6 class="mb-0 fw-bold"><i class="bi bi-stars me-2 text-primary"></i>Agentic 流式问答</h6>
    <div class="d-flex align-items-center gap-2">
      <select class="form-select form-select-sm" id="space-select" style="width:220px"></select>
      <select class="form-select form-select-sm" id="model-select" style="width:130px">
        <option value="">默认模型</option>
        <option value="LLAMA_CPP">llama.cpp</option>
        <option value="DASHSCOPE">DashScope</option>
      </select>
      <select class="form-select form-select-sm" id="topk-select" style="width:86px">
        <option value="3">Top 3</option>
        <option value="5" selected>Top 5</option>
        <option value="10">Top 10</option>
      </select>
      <div class="form-check form-switch m-0 ms-1" title="开启后展示模型推理旁白（需 14B 思考模型 + llama-server --reasoning-format none）">
        <input class="form-check-input" type="checkbox" id="deepthink-toggle" checked>
        <label class="form-check-label small text-muted" for="deepthink-toggle">深度思考</label>
      </div>
    </div>
  </div>

  <main class="md-chat" style="height:calc(100vh - 53px)">
    <div class="md-messages" id="chat-messages"></div>
    <div class="chat-input-bar">
      <div class="d-flex gap-2">
        <textarea class="form-control" id="question-input" rows="2" placeholder="问一个需要多跳推理的问题，答案会逐步输出..." style="resize:none"></textarea>
        <button class="btn btn-primary px-3" id="btn-send"><i class="bi bi-send-fill"></i></button>
      </div>
      <small class="text-muted">Agent 会先搜索片段、按需读取完整 section，最终答复逐 token 流式输出。</small>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/md-pages.js"></script>
<script>
initMdQaPage({
  stream: true,
  eventStream: true,
  streamEndpoint: 'ask/agentic/stream',
  loading: 'Agent 正在规划检索并读取 section...',
  welcome: 'Agentic 流式问答兼顾多跳检索与逐步输出，适合较长且需要追问式检索的答案。'
});
</script>
</body>
</html>
