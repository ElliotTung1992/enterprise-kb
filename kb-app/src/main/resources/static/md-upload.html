<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown 上传 — 企业知识库</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/app.css" rel="stylesheet">
<style>body{visibility:hidden}</style>
</head>
<body>

<nav class="kb-sidebar">
  <div class="brand"><i class="bi bi-journal-bookmark-fill me-2"></i>知识库</div>
  <ul class="nav flex-column mt-2 flex-grow-1">
    <li><a class="nav-link" href="/dashboard.html"><i class="bi bi-grid-1x2"></i>仪表盘</a></li>
    <li><a class="nav-link active" href="/md-upload.html"><i class="bi bi-cloud-upload"></i>Markdown 上传</a></li>
    <li><a class="nav-link" href="/md-qa-standard.html"><i class="bi bi-chat-square-text"></i>标准问答</a></li>
    <li><a class="nav-link" href="/md-qa-agentic-stream.html"><i class="bi bi-stars"></i>Agentic 流式</a></li>
  </ul>
  <div class="p-3 border-top" style="border-color:#312e81!important">
    <small class="d-block text-truncate mb-2" id="sidebar-username"></small>
    <a href="/index.html" style="color:#c7d2fe;font-size:.82rem;display:block;margin-bottom:.4rem"><i class="bi bi-house me-1"></i>返回首页</a>
    <a href="#" onclick="logout()" style="color:#c7d2fe;font-size:.85rem"><i class="bi bi-box-arrow-right me-1"></i>退出</a>
  </div>
</nav>

<div class="kb-main">
  <div class="kb-topbar">
    <h6 class="mb-0 fw-bold"><i class="bi bi-cloud-upload me-2 text-primary"></i>Markdown 结构化入库</h6>
    <select class="form-select form-select-sm" id="space-select" style="width:220px"></select>
  </div>

  <div class="p-4 md-upload-layout">
    <div class="row g-4">
      <div class="col-lg-7">
        <div class="kb-card">
          <div class="md-upload-zone" id="upload-zone">
            <i class="bi bi-filetype-md d-block fs-1 text-primary mb-2"></i>
            <div class="fw-semibold" id="file-name">选择 .md 文件</div>
            <div class="text-muted small">上传后进入 Markdown 结构化切分、向量化和图片理解流程</div>
            <input type="file" id="file-input" accept=".md,.markdown" class="d-none">
          </div>
          <button class="btn btn-primary w-100 mt-3" id="btn-upload" disabled>
            <i class="bi bi-upload me-1"></i>上传并入库
          </button>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="kb-card h-100">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <div class="fw-bold">Markdown 文档</div>
            <button class="btn btn-sm btn-outline-secondary" id="btn-refresh" title="刷新">
              <i class="bi bi-arrow-clockwise"></i>
            </button>
          </div>
          <div id="doc-list"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/md-pages.js"></script>
<script>
let selectedFile = null;
window.onMdSpaceChanged = loadMdDocuments;

document.getElementById('upload-zone').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change', e => {
  selectedFile = e.target.files[0] || null;
  document.getElementById('btn-upload').disabled = !selectedFile;
  document.getElementById('file-name').textContent = selectedFile ? selectedFile.name : '选择 .md 文件';
});

document.getElementById('btn-upload').addEventListener('click', async () => {
  const spaceId = document.getElementById('space-select').value;
  if (!spaceId || !selectedFile) return;
  const form = new FormData();
  form.append('file', selectedFile);
  document.getElementById('btn-upload').disabled = true;
  try {
    await apiFetch(`/spaces/${spaceId}/md-documents/upload`, { method: 'POST', body: form });
    showToast('Markdown 已提交入库');
    selectedFile = null;
    document.getElementById('file-input').value = '';
    document.getElementById('file-name').textContent = '选择 .md 文件';
    await loadMdDocuments();
  } catch (e) {
    showToast('上传失败：' + e.message, 'error');
  } finally {
    document.getElementById('btn-upload').disabled = !selectedFile;
  }
});

document.getElementById('btn-refresh').addEventListener('click', loadMdDocuments);
initMdPage();
</script>
</body>
</html>
