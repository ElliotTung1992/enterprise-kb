<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上传文档 — 企业知识库</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/app.css" rel="stylesheet">
<style>body{visibility:hidden}</style>
</head>
<body>

<nav class="kb-sidebar">
  <div class="brand"><i class="bi bi-journal-bookmark-fill me-2"></i>知识库</div>
  <ul class="nav flex-column mt-2 flex-grow-1">
    <li><a class="nav-link" href="/dashboard.html"><i class="bi bi-grid-1x2"></i>仪表盘</a></li>
    <li><a class="nav-link active" href="/upload.html"><i class="bi bi-cloud-upload"></i>上传文档</a></li>
    <li><a class="nav-link" href="/search.html"><i class="bi bi-search"></i>搜索</a></li>
    <li><a class="nav-link" href="/qa.html"><i class="bi bi-chat-dots"></i>AI 问答</a></li>
    <li><a class="nav-link" href="/tags.html"><i class="bi bi-tags"></i>标签管理</a></li>
  </ul>
  <div class="p-3 border-top" style="border-color:#312e81!important">
    <small class="d-block text-truncate mb-2" id="sidebar-username"></small>
    <a href="#" onclick="logout()" style="color:#c7d2fe;font-size:.85rem"><i class="bi bi-box-arrow-right me-1"></i>退出</a>
  </div>
</nav>

<div class="kb-main">
  <div class="kb-topbar">
    <h6 class="mb-0 fw-bold"><i class="bi bi-cloud-upload me-2 text-primary"></i>上传文档</h6>
    <div class="d-flex align-items-center gap-2">
      <span class="text-muted small fw-semibold">目标空间：</span>
      <select class="form-select form-select-sm" id="space-select" style="width:200px"></select>
    </div>
  </div>

  <div class="p-4">
    <div class="row g-4">
      <!-- Drop zone -->
      <div class="col-lg-6">
        <div class="kb-card">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <h6 class="fw-bold mb-0">拖拽或选择文件</h6>
            <div class="dropdown">
              <button class="btn btn-sm btn-outline-primary dropdown-toggle" id="space-badge-btn" type="button"
                      data-bs-toggle="dropdown" aria-expanded="false" style="font-size:.8rem">
                <i class="bi bi-collection me-1"></i><span id="current-space-name">未选择空间</span>
              </button>
              <ul class="dropdown-menu dropdown-menu-end" id="space-dropdown-menu"></ul>
            </div>
          </div>
          <div class="drop-zone" id="drop-zone">
            <i class="bi bi-cloud-arrow-up d-block mb-2"></i>
            <div class="fw-semibold">拖拽文件至此处</div>
            <div class="text-muted small mt-1">支持 PDF、Word (.docx/.doc)、Markdown (.md)、TXT、HTML</div>
            <div class="text-muted small">单文件最大 100 MB</div>
            <input type="file" id="file-input" multiple accept=".pdf,.docx,.doc,.md,.txt,.html,.htm" class="d-none">
          </div>
          <div class="mt-3 d-flex gap-2">
            <button class="btn btn-primary" id="btn-select"><i class="bi bi-folder2-open me-1"></i>选择文件</button>
            <button class="btn btn-success" id="btn-upload" disabled><i class="bi bi-upload me-1"></i>开始上传</button>
            <button class="btn btn-outline-secondary" id="btn-clear"><i class="bi bi-x me-1"></i>清空</button>
          </div>
        </div>
      </div>

      <!-- File list -->
      <div class="col-lg-6">
        <div class="kb-card">
          <h6 class="fw-bold mb-3">文件列表 <span class="badge bg-secondary" id="file-count">0</span></h6>
          <div id="file-list" style="max-height:400px;overflow-y:auto"></div>
        </div>
      </div>
    </div>

    <!-- Upload history -->
    <div class="kb-card mt-4">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h6 class="fw-bold mb-0"><i class="bi bi-clock-history me-2 text-primary"></i>近期上传</h6>
        <button class="btn btn-sm btn-outline-secondary" id="btn-refresh-history" title="刷新">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
      </div>
      <div id="upload-history"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
requireAuth();
document.getElementById('sidebar-username').textContent = localStorage.getItem('username') || '';

let selectedFiles = [];

const statusColors = { PENDING: 'badge-pending', PROCESSING: 'badge-processing', READY: 'badge-ready', FAILED: 'badge-failed' };
const statusLabels = { PENDING: '待处理', PROCESSING: '处理中', READY: '就绪', FAILED: '失败' };

// ── Spaces ────────────────────────────────────────────────────────────────

let allSpaces = [];

function updateSpaceBadge(name) {
  document.getElementById('current-space-name').textContent = name || '未选择空间';
}

function buildSpaceDropdown() {
  const menu = document.getElementById('space-dropdown-menu');
  const currentId = document.getElementById('space-select').value;
  menu.innerHTML = allSpaces.map((s, i) => `
    <li>
      <a class="dropdown-item d-flex align-items-center gap-2 ${s.id === currentId ? 'active' : ''}"
         href="#" onclick="selectSpace(${i});return false;">
        <i class="bi bi-collection"></i>
        <span>${escHtml(s.name)}</span>
        ${s.id === currentId ? '<i class="bi bi-check ms-auto"></i>' : ''}
      </a>
    </li>`).join('');
}

function selectSpace(idx) {
  const s = allSpaces[idx];
  const sel = document.getElementById('space-select');
  sel.value = s.id;
  setCurrentSpace(s.id, s.name);
  updateSpaceBadge(s.name);
  buildSpaceDropdown();
  loadHistory(s.id);
}

async function loadSpaces() {
  const res = await apiFetch('/spaces');
  allSpaces = res.data || [];
  const sel = document.getElementById('space-select');
  if (!allSpaces.length) {
    sel.innerHTML = '<option value="">— 暂无空间 —</option>';
    updateSpaceBadge('暂无空间');
    return;
  }
  allSpaces.forEach(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = s.name; sel.appendChild(o); });
  const saved = localStorage.getItem('current_space_id');
  if (saved && allSpaces.find(s => s.id === saved)) sel.value = saved;
  else sel.value = allSpaces[0].id;
  updateSpaceBadge(sel.options[sel.selectedIndex]?.text);
  buildSpaceDropdown();
  sel.addEventListener('change', () => {
    setCurrentSpace(sel.value, sel.options[sel.selectedIndex].text);
    updateSpaceBadge(sel.options[sel.selectedIndex].text);
    buildSpaceDropdown();
    loadHistory(sel.value);
  });
}

// ── Drop zone ─────────────────────────────────────────────────────────────

const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); addFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', () => addFiles(fileInput.files));
document.getElementById('btn-select').addEventListener('click', () => fileInput.click());
document.getElementById('btn-clear').addEventListener('click', () => { selectedFiles = []; renderFileList(); });

function addFiles(fileList) {
  for (const f of fileList) selectedFiles.push(f);
  renderFileList();
}

function renderFileList() {
  document.getElementById('file-count').textContent = selectedFiles.length;
  document.getElementById('btn-upload').disabled = selectedFiles.length === 0;
  const container = document.getElementById('file-list');
  if (!selectedFiles.length) { container.innerHTML = '<div class="text-muted text-center py-3">暂无文件</div>'; return; }
  container.innerHTML = selectedFiles.map((f, i) => `
    <div class="d-flex align-items-center py-2 border-bottom" id="file-row-${i}">
      <i class="bi ${fileIcon(f.name)} me-2 text-primary"></i>
      <div class="flex-grow-1 overflow-hidden">
        <div class="text-truncate small fw-semibold">${escHtml(f.name)}</div>
        <div class="text-muted" style="font-size:.75rem">${formatSize(f.size)}</div>
      </div>
      <div id="file-status-${i}"><span class="text-muted small">待上传</span></div>
      <button class="btn btn-sm btn-outline-danger ms-2" onclick="removeFile(${i})"><i class="bi bi-x"></i></button>
    </div>`).join('');
}

function removeFile(i) { selectedFiles.splice(i, 1); renderFileList(); }

function fileIcon(name) {
  if (!name) return 'bi-file-earmark-text text-secondary';
  if (name.endsWith('.pdf')) return 'bi-file-earmark-pdf text-danger';
  if (name.endsWith('.docx') || name.endsWith('.doc')) return 'bi-file-earmark-word text-primary';
  if (name.endsWith('.md')) return 'bi-file-earmark-code text-success';
  if (name.endsWith('.html') || name.endsWith('.htm')) return 'bi-file-earmark-code text-warning';
  return 'bi-file-earmark-text text-secondary';
}

// ── Upload ────────────────────────────────────────────────────────────────

document.getElementById('btn-upload').addEventListener('click', async () => {
  const spaceId = document.getElementById('space-select').value;
  if (!spaceId) { showToast('请先选择一个空间', 'error'); return; }

  const btnUpload = document.getElementById('btn-upload');
  btnUpload.disabled = true;

  for (let i = 0; i < selectedFiles.length; i++) {
    const statusEl = document.getElementById(`file-status-${i}`);
    if (!statusEl) continue;
    statusEl.innerHTML = '<span class="spinner-border spinner-border-sm text-primary"></span>';

    const form = new FormData();
    form.append('file', selectedFiles[i]);

    try {
      const res = await apiFetch(`/spaces/${spaceId}/documents/upload`, { method: 'POST', body: form });
      const doc = res.data;
      statusEl.innerHTML = '<span class="badge badge-processing">处理中</span>';
      pollStatus(spaceId, doc.id, i);
    } catch (err) {
      statusEl.innerHTML = `<span class="badge badge-failed" title="${escHtml(err.message)}">失败</span>`;
    }
  }

  // 上传请求全部发出后恢复按钮，无论成功或失败都可重试
  btnUpload.disabled = selectedFiles.length === 0;
});

function pollStatus(spaceId, docId, fileIndex) {
  const interval = setInterval(async () => {
    try {
      const res = await apiFetch(`/spaces/${spaceId}/documents/${docId}`);
      const doc = res.data;
      const statusEl = document.getElementById(`file-status-${fileIndex}`);
      if (!statusEl) { clearInterval(interval); return; }

      if (doc.status === 'READY') {
        statusEl.innerHTML = `<span class="badge badge-ready">就绪 (${doc.chunkCount} 块)</span>`;
        clearInterval(interval);
        loadHistory(spaceId);
      } else if (doc.status === 'FAILED') {
        statusEl.innerHTML = `<span class="badge badge-failed" title="${escHtml(doc.errorMessage)}">失败</span>`;
        clearInterval(interval);
      } else {
        const step = ['PENDING', 'PROCESSING'].indexOf(doc.status);
        statusEl.innerHTML = `<div class="step-bar" style="width:120px">
          <div class="step done">待处理</div>
          <div class="step ${step >= 1 ? 'active' : ''}">解析</div>
          <div class="step">就绪</div>
        </div>`;
      }
    } catch { clearInterval(interval); }
  }, 2000);
}

// ── History ───────────────────────────────────────────────────────────────

async function loadHistory(spaceId) {
  if (!spaceId) return;
  const res = await apiFetch(`/spaces/${spaceId}/documents?size=20`);
  const docs = res.data?.content || [];
  const container = document.getElementById('upload-history');
  if (!docs.length) { container.innerHTML = '<div class="text-muted text-center py-3">暂无记录</div>'; return; }
  container.innerHTML = docs.map(d => `
    <div class="d-flex align-items-center py-2 border-bottom gap-2">
      <i class="bi ${fileIcon(d.originalFilename || '')} me-1 text-primary flex-shrink-0"></i>
      <div class="flex-grow-1 overflow-hidden">
        <div class="fw-semibold text-truncate small">${escHtml(d.title)}</div>
        <small class="text-muted">${new Date(d.createdAt).toLocaleString('zh-CN')}${d.chunkCount ? ' · ' + d.chunkCount + ' 块' : ''}</small>
      </div>
      <span class="badge ${statusColors[d.status]} flex-shrink-0">${statusLabels[d.status]}</span>
      ${d.status === 'FAILED' ? `
        <button class="btn btn-xs btn-outline-warning" title="重新处理" onclick="reprocessDoc('${d.id}','${spaceId}',this)">
          <i class="bi bi-arrow-repeat" style="font-size:.75rem"></i>
        </button>` : ''}
      <button class="btn btn-xs btn-outline-danger" title="删除" onclick="deleteHistoryDoc('${d.id}','${spaceId}',this)">
        <i class="bi bi-trash3" style="font-size:.75rem"></i>
      </button>
    </div>`).join('');
}

async function deleteHistoryDoc(docId, spaceId, btn) {
  if (!confirm('确认删除此文档？')) return;
  try {
    await apiFetch(`/spaces/${spaceId}/documents/${docId}`, { method: 'DELETE' });
    showToast('文档已删除');
    btn.closest('.border-bottom').remove();
  } catch (err) { showToast(err.message, 'error'); }
}

async function reprocessDoc(docId, spaceId, btn) {
  try {
    await apiFetch(`/spaces/${spaceId}/documents/${docId}/reprocess`, { method: 'POST' });
    showToast('已重新提交处理');
    loadHistory(spaceId);
  } catch (err) { showToast(err.message, 'error'); }
}

document.getElementById('btn-refresh-history').addEventListener('click', () => {
  const spaceId = document.getElementById('space-select').value;
  if (spaceId) loadHistory(spaceId);
});

function formatSize(b) { if (!b) return ''; if (b < 1024) return b + ' B'; if (b < 1048576) return (b/1024).toFixed(1) + ' KB'; return (b/1048576).toFixed(1) + ' MB'; }
function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

loadSpaces().then(() => {
  const spaceId = document.getElementById('space-select').value;
  if (spaceId) loadHistory(spaceId);
});
</script>
</body>
</html>
