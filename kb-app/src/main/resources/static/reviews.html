<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>审核中心 — 企业知识库</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/assets/css/app.css" rel="stylesheet">
<style>
body { visibility: hidden }
.filter-bar {
  display: flex;
  align-items: center;
  gap: .75rem;
  flex-wrap: wrap;
}
.status-tabs {
  display: flex;
  gap: .25rem;
}
.status-tab {
  padding: .3rem .85rem;
  border-radius: 99px;
  font-size: .8rem;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid #e2e8f0;
  background: #fff;
  color: #64748b;
  transition: all .15s;
}
.status-tab.active {
  background: #4f46e5;
  border-color: #4f46e5;
  color: #fff;
}
.review-table { width: 100%; border-collapse: separate; border-spacing: 0; }
.review-table th {
  font-size: .75rem;
  font-weight: 600;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: .04em;
  padding: .65rem 1rem;
  background: #f8fafc;
  border-bottom: 1px solid #e2e8f0;
  white-space: nowrap;
}
.review-table td {
  padding: .75rem 1rem;
  border-bottom: 1px solid #f1f5f9;
  vertical-align: middle;
  font-size: .875rem;
}
.review-table tr:last-child td { border-bottom: none; }
.review-table tbody tr { cursor: pointer; transition: background .1s; }
.review-table tbody tr:hover { background: #f8fafc; }
.review-table tbody tr.expanded { background: #f8fafc; }
.detail-row { display: none; }
.detail-row.open { display: table-row; }
.detail-cell {
  padding: 0 !important;
  border-bottom: 1px solid #e2e8f0 !important;
}
.detail-inner {
  padding: 1rem 1.25rem 1.25rem;
  background: #f8fafc;
  border-top: 1px solid #e2e8f0;
}
.type-badge {
  font-size: .72rem;
  font-weight: 600;
  padding: .2rem .55rem;
  border-radius: 4px;
}
.type-after-sales { background: #fdf4ff; color: #7c3aed; }
.status-badge {
  font-size: .72rem;
  font-weight: 600;
  padding: .2rem .55rem;
  border-radius: 4px;
}
.status-pending  { background: #fef3c7; color: #92400e; }
.status-approved { background: #dcfce7; color: #166534; }
.status-rejected { background: #fee2e2; color: #991b1b; }
.conv-snippet .msg-row { margin-bottom: .25rem; display: flex; }
.conv-snippet .msg-row.user  { justify-content: flex-end; }
.conv-snippet .msg-row.user span  { background:#4f46e5;color:#fff;border-radius:8px;padding:.2rem .6rem;font-size:.8rem;max-width:80%; }
.conv-snippet .msg-row.assistant span { background:#e2e8f0;color:#1e293b;border-radius:8px;padding:.2rem .6rem;font-size:.8rem;max-width:80%; }
.result-bubble {
  background:#f0fdf4;border:1px solid #86efac;border-radius:6px;
  padding:.55rem .875rem;font-size:.85rem;color:#166534;
}
.result-bubble.reject { background:#fff1f2;border-color:#fda4af;color:#9f1239; }
.empty-state { text-align:center;padding:3rem;color:#94a3b8; }
.empty-state i { font-size:2.5rem;display:block;margin-bottom:.5rem; }
</style>
</head>
<body>

<nav class="kb-sidebar">
  <div class="brand"><i class="bi bi-headset me-2"></i>商城客服</div>
  <ul class="nav flex-column mt-2 flex-grow-1">
    <li><a class="nav-link" href="/customer.html"><i class="bi bi-headset"></i>客户助手</a></li>
    <li><a class="nav-link active" href="/reviews.html"><i class="bi bi-clipboard2-check"></i>审核中心</a></li>
  </ul>
  <div class="px-3 pb-2">
    <a href="/index.html" class="nav-link" style="font-size:.82rem;color:#c7d2fe"><i class="bi bi-house me-1"></i>返回首页</a>
  </div>
  <div class="p-3 border-top" style="border-color:#312e81!important">
    <small class="d-block text-truncate mb-2" id="sidebar-username"></small>
    <a href="#" onclick="logout()" style="color:#c7d2fe;font-size:.85rem"><i class="bi bi-box-arrow-right me-1"></i>退出</a>
  </div>
</nav>

<div class="kb-main">
  <div class="kb-topbar">
    <h6 class="mb-0 fw-bold"><i class="bi bi-clipboard2-check me-2 text-warning"></i>审核中心</h6>
    <button class="btn btn-sm btn-outline-secondary" id="btn-refresh">
      <i class="bi bi-arrow-clockwise me-1"></i>刷新
    </button>
  </div>

  <div class="p-4">
    <!-- Filter bar -->
    <div class="filter-bar mb-3">
      <div class="status-tabs">
        <span class="status-tab active" data-status="PENDING">待审核</span>
        <span class="status-tab" data-status="APPROVED">已批准</span>
        <span class="status-tab" data-status="REJECTED">已拒绝</span>
        <span class="status-tab" data-status="ALL">全部</span>
      </div>
      <select class="form-select form-select-sm ms-auto" id="type-filter" style="width:160px">
        <option value="">全部类型</option>
        <option value="AFTER_SALES">售后申请</option>
      </select>
      <span class="text-muted small" id="count-label"></span>
    </div>

    <!-- Table -->
    <div class="kb-card p-0 overflow-hidden">
      <table class="review-table">
        <thead>
          <tr>
            <th style="width:110px">类型</th>
            <th>摘要</th>
            <th style="width:90px">状态</th>
            <th style="width:110px">提交时间</th>
            <th style="width:160px">操作</th>
          </tr>
        </thead>
        <tbody id="review-tbody">
          <tr><td colspan="5" class="text-center py-4">
            <span class="spinner-border spinner-border-sm text-secondary me-2"></span>加载中…
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 审核意见 Modal -->
<div class="modal fade" id="decision-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h6 class="modal-title fw-bold" id="modal-title">审核意见</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="form-label small text-muted mb-1" id="modal-label">意见（可选）</label>
        <textarea class="form-control" id="modal-comment" rows="3" style="resize:none"></textarea>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-sm fw-semibold" id="modal-confirm">确认</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
requireAuth();
document.getElementById('sidebar-username').textContent = localStorage.getItem('username') || '';

let allReviews = [];
let activeStatus = 'PENDING';
let activeType = '';
let pendingDecision = null;
const decisionModal = new bootstrap.Modal(document.getElementById('decision-modal'));

// ---------- Load ----------
async function loadReviews() {
  const tbody = document.getElementById('review-tbody');
  tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4">
    <span class="spinner-border spinner-border-sm text-secondary me-2"></span>加载中…
  </td></tr>`;
  try {
    const qs = activeStatus !== 'ALL' ? `?status=${activeStatus}` : '';
    const res = await apiFetch(`/after-sales/reviews${qs}`);
    allReviews = (res.data || []).map(r => ({ ...r, reviewType: 'AFTER_SALES' }));
    renderTable();
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">加载失败：${escHtml(e.message)}</td></tr>`;
  }
}

// ---------- Filter + Render ----------
function filteredRows() {
  return allReviews.filter(r => !activeType || r.reviewType === activeType);
}

function renderTable() {
  const rows = filteredRows();
  document.getElementById('count-label').textContent = rows.length ? `共 ${rows.length} 条` : '';
  const tbody = document.getElementById('review-tbody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="5">
      <div class="empty-state">
        <i class="bi bi-check2-circle text-success"></i>
        <div class="fw-semibold text-success">暂无${activeStatus === 'PENDING' ? '待审核' : ''}记录</div>
      </div>
    </td></tr>`;
    return;
  }
  tbody.innerHTML = '';
  rows.forEach(r => {
    tbody.appendChild(buildRow(r));
    tbody.appendChild(buildDetailRow(r));
  });
}

// ---------- Table row ----------
function buildRow(r) {
  const tr = document.createElement('tr');
  tr.id = `row-${r.id}`;
  tr.innerHTML = `
    <td><span class="type-badge type-after-sales">售后申请</span></td>
    <td>
      <div class="fw-medium text-truncate" style="max-width:340px">${escHtml(r.reason || '（未填写诉求）')}</div>
      ${r.orderId ? `<div class="text-muted" style="font-size:.75rem;font-family:monospace">${escHtml(r.orderId)}</div>` : ''}
    </td>
    <td><span class="status-badge ${statusClass(r.status)}">${statusLabel(r.status)}</span></td>
    <td class="text-muted" style="font-size:.8rem">${formatTime(r.createdAt)}</td>
    <td id="actions-${r.id}">${buildActions(r)}</td>`;
  tr.addEventListener('click', e => {
    if (e.target.closest('button')) return;
    toggleDetail(r.id);
  });
  return tr;
}

function buildActions(r) {
  if (r.status && r.status !== 'PENDING') {
    return `<span class="badge ${r.status === 'APPROVED' ? 'bg-success' : 'bg-danger'} rounded-pill" style="font-size:.72rem">
      <i class="bi bi-${r.status === 'APPROVED' ? 'check-lg' : 'x-lg'} me-1"></i>${r.status === 'APPROVED' ? '已批准' : '已拒绝'}
    </span>`;
  }
  return `
    <button class="btn btn-sm btn-success py-0 px-2 me-1" style="font-size:.8rem"
            onclick="openDecision('${r.id}','approve',event)"><i class="bi bi-check-lg me-1"></i>批准</button>
    <button class="btn btn-sm btn-outline-danger py-0 px-2" style="font-size:.8rem"
            onclick="openDecision('${r.id}','reject',event)"><i class="bi bi-x-lg me-1"></i>拒绝</button>
    <span class="spinner-border spinner-border-sm text-secondary ms-1 d-none" id="spinner-${r.id}"></span>`;
}

// ---------- Detail row ----------
function buildDetailRow(r) {
  const tr = document.createElement('tr');
  tr.className = 'detail-row';
  tr.id = `detail-${r.id}`;

  const convHtml = buildConvHtml(r.conversationSnapshot);
  const orderHtml = buildOrderHtml(r.orderDetails);

  tr.innerHTML = `<td colspan="5" class="detail-cell">
    <div class="detail-inner">
      <div class="row g-3">
        ${convHtml ? `<div class="col-md-6">
          <div class="small fw-semibold text-muted mb-2"><i class="bi bi-chat-square-text me-1"></i>对话摘要</div>
          <div class="conv-snippet border rounded p-2 bg-white" style="max-height:160px;overflow-y:auto">${convHtml}</div>
        </div>` : ''}
        ${orderHtml ? `<div class="col-md-6">
          <div class="small fw-semibold text-muted mb-2"><i class="bi bi-receipt me-1"></i>订单详情</div>
          <pre class="bg-white border rounded p-2 m-0" style="font-size:.75rem;max-height:160px;overflow:auto">${escHtml(orderHtml)}</pre>
        </div>` : ''}
        <div id="result-${r.id}"></div>
      </div>
    </div>
  </td>`;
  return tr;
}

function toggleDetail(id) {
  const row = document.getElementById(`row-${id}`);
  const detail = document.getElementById(`detail-${id}`);
  const isOpen = detail.classList.contains('open');
  // 收起所有
  document.querySelectorAll('.detail-row.open').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('tbody tr.expanded').forEach(el => el.classList.remove('expanded'));
  if (!isOpen) {
    detail.classList.add('open');
    row.classList.add('expanded');
  }
}

// ---------- Decision ----------
function openDecision(id, action, event) {
  event.stopPropagation();
  pendingDecision = { id, action };
  const isApprove = action === 'approve';
  document.getElementById('modal-title').textContent = isApprove ? '批准申请' : '拒绝申请';
  document.getElementById('modal-label').textContent = isApprove ? '批准意见（可选）' : '拒绝原因（建议填写）';
  document.getElementById('modal-comment').value = '';
  document.getElementById('modal-comment').placeholder = isApprove
    ? '如：订单符合退款条件，已核实。' : '如：订单已超过售后期限。';
  const btn = document.getElementById('modal-confirm');
  btn.textContent = isApprove ? '确认批准' : '确认拒绝';
  btn.className = `btn btn-sm fw-semibold ${isApprove ? 'btn-success' : 'btn-danger'}`;
  decisionModal.show();
}

document.getElementById('modal-confirm').addEventListener('click', async () => {
  if (!pendingDecision) return;
  const { id, action } = pendingDecision;
  const comment = document.getElementById('modal-comment').value.trim() || null;
  decisionModal.hide();
  await submitDecision(id, action, comment);
});

async function submitDecision(id, action, comment) {
  const actionsEl = document.getElementById(`actions-${id}`);
  const spinnerEl = document.getElementById(`spinner-${id}`);
  actionsEl.querySelectorAll('button').forEach(b => b.disabled = true);
  spinnerEl?.classList.remove('d-none');

  try {
    const res = await apiFetch(`/after-sales/reviews/${id}/${action}`, {
      method: 'POST',
      body: JSON.stringify({ comment })
    });
    const answer = res?.data?.answer || (action === 'approve' ? '已批准，已通知客户。' : '已拒绝，已通知客户。');

    // 更新操作列
    actionsEl.innerHTML = `<span class="badge ${action === 'approve' ? 'bg-success' : 'bg-danger'} rounded-pill" style="font-size:.72rem">
      <i class="bi bi-${action === 'approve' ? 'check-lg' : 'x-lg'} me-1"></i>${action === 'approve' ? '已批准' : '已拒绝'}
    </span>`;

    // 展开详情并显示结果
    const detailRow = document.getElementById(`detail-${id}`);
    detailRow.classList.add('open');
    document.getElementById(`row-${id}`).classList.add('expanded');
    const resultEl = document.getElementById(`result-${id}`);
    resultEl.className = `result-bubble${action === 'reject' ? ' reject' : ''} mt-2`;
    resultEl.innerHTML = `<i class="bi bi-robot me-1"></i><strong>AI 通知客户：</strong>${escHtml(answer)}`;

    // 更新内存状态
    const item = allReviews.find(r => r.id === id);
    if (item) item.status = action === 'approve' ? 'APPROVED' : 'REJECTED';

    showToast(action === 'approve' ? '已批准' : '已拒绝', action === 'approve' ? 'success' : 'error');
  } catch (e) {
    spinnerEl?.classList.add('d-none');
    actionsEl.querySelectorAll('button').forEach(b => b.disabled = false);
    showToast('操作失败：' + e.message, 'error');
  }
}

// ---------- Helpers ----------
function buildConvHtml(snapshot) {
  if (!snapshot) return '';
  try {
    const msgs = typeof snapshot === 'string' ? JSON.parse(snapshot) : snapshot;
    if (!Array.isArray(msgs) || !msgs.length) return '';
    return msgs.slice(-6).map(m =>
      `<div class="msg-row ${m.role}"><span>${escHtml((m.content||'').substring(0,100))}${(m.content||'').length>100?'…':''}</span></div>`
    ).join('');
  } catch { return ''; }
}

function buildOrderHtml(orderDetails) {
  if (!orderDetails) return '';
  try {
    return JSON.stringify(typeof orderDetails === 'string' ? JSON.parse(orderDetails) : orderDetails, null, 2);
  } catch { return typeof orderDetails === 'string' ? orderDetails : ''; }
}

function statusClass(s) {
  if (!s || s === 'PENDING') return 'status-pending';
  if (s === 'APPROVED') return 'status-approved';
  return 'status-rejected';
}
function statusLabel(s) {
  if (!s || s === 'PENDING') return '待审核';
  if (s === 'APPROVED') return '已批准';
  return '已拒绝';
}
function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), diff = (now - d) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff/60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + ' 小时前';
  if (diff < 172800) return '昨天';
  return d.toLocaleDateString('zh-CN', { month:'numeric', day:'numeric' });
}
function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ---------- Events ----------
document.querySelectorAll('.status-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.status-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeStatus = tab.dataset.status;
    loadReviews();
  });
});
document.getElementById('type-filter').addEventListener('change', e => {
  activeType = e.target.value;
  renderTable();
});
document.getElementById('btn-refresh').addEventListener('click', loadReviews);

// ---------- Init ----------
loadReviews();
</script>
</body>
</html>
