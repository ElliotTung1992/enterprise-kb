server:
  port: 8081
  servlet:
    context-path: /
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: enterprise-kb

  autoconfigure:
    exclude:
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration

  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:dge2026}
      database: 0

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/enterprise_kb}
    username: ${SPRING_DATASOURCE_USERNAME:kb_user}
    password: ${SPRING_DATASOURCE_PASSWORD:dge2026}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  web:
    resources:
      static-locations: file:kb-app/src/main/resources/static/,classpath:/static/

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 200MB

  ai:
    minimax:
      api-key: ${MINIMAX_API_KEY:}
      chat:
        options:
          model: MiniMax-M2.7-highspeed

    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v2
      rerank:
        options:
          model: gte-rerank

    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-4-5

    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
        database-name: default
        collection-name: kb_chunks
        embedding-dimension: 1536
        index-type: IVF_FLAT
        metric-type: COSINE
        initialize-schema: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    jdbc-type-for-null: NULL
  type-handlers-package: com.enterprise.kb.document.typehandler
  type-aliases-package: >
    com.enterprise.kb.user.model,
    com.enterprise.kb.auth.model,
    com.enterprise.kb.document.model,
    com.enterprise.kb.graph.model

pagehelper:
  helper-dialect: postgresql
  reasonable: true
  support-methods-arguments: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

enterprise:
  kb:
    jwt:
      secret: ${JWT_SECRET:e25007bd691e02e014a1809d87fcda0fa1e9800f0accd3d2a5be68298b96833f}
      access-token-expiry-minutes: 60
      refresh-token-expiry-days: 30
    ai:
      default-provider: MINIMAX
      default-embedding-provider: DASHSCOPE
      minimax-openai-base-url: ${MINIMAX_OPENAI_BASE_URL:https://api.minimax.chat}
      context-limit: ${AI_CONTEXT_LIMIT:204800}
      agentic:
        chunk-token-size: ${AI_AGENTIC_CHUNK_TOKEN_SIZE:512}
      # 两层域路由的 Tier-1 路由器配置
      router-provider: ${ROUTER_PROVIDER:MINIMAX}
      router-context-turns: ${ROUTER_CONTEXT_TURNS:3}
    customer-assistant:
      # 路由架构 kill-switch：true 走两层路由流水线，false 回退旧单体 ReactAgent 路径
      routing-enabled: ${CUSTOMER_ASSISTANT_ROUTING_ENABLED:true}
      # 影子模式：旧路径下旁路跑一次 Tier-1 域路由，仅记录判定结果用于评估对照
      shadow-routing-enabled: ${CUSTOMER_ASSISTANT_SHADOW_ROUTING_ENABLED:true}
    trace:
      # Agent Trace 总开关：true 时记录 trace 外壳和 step；false 时 TraceRecorder 直接跳过
      enabled: ${AGENT_TRACE_ENABLED:true}
      # FULL_RAW 模式开关：true 时保存完整 prompt/history/tool input/output 等原始载荷
      full-raw-enabled: ${AGENT_TRACE_FULL_RAW_ENABLED:true}
      # Trace 采样率：1.0 表示全量采集，0 表示不采集，0.1 表示约 10% 采样
      sample-rate: ${AGENT_TRACE_SAMPLE_RATE:1.0}
      # 单个 JSON payload 最大字节数，超过后写入截断 preview 并标记 payload_truncated=true
      max-payload-bytes: ${AGENT_TRACE_MAX_PAYLOAD_BYTES:262144}
      # 是否记录对话历史消息，用于离线复现多轮上下文
      include-history: ${AGENT_TRACE_INCLUDE_HISTORY:true}
      # 是否记录 system prompt 和工具描述，用于复现模型输入
      include-prompts: ${AGENT_TRACE_INCLUDE_PROMPTS:true}
      # 是否记录检索片段正文，用于评估检索和答案 grounding
      include-retrieval-excerpts: ${AGENT_TRACE_INCLUDE_RETRIEVAL_EXCERPTS:true}
    md:
      # md 关键词路算法：TRGM(默认，pg_trgm 子串相似度) / BM25(vchord_bm25 词级打分)，一键回退
      keyword-mode: ${MD_KEYWORD_MODE:TRGM}
      # 索引与查询共用的 pg_tokenizer 配置名（建于运维脚本 db/manual/md-bm25-build.sql）
      bm25-tokenizer: ${MD_BM25_TOKENIZER:md_tok}
      # vchord_bm25 索引名，to_bm25query 按名引用
      bm25-index: ${MD_BM25_INDEX:idx_md_child_bm25}
      image:
        minio-endpoint: ${MD_IMAGE_MINIO_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
        bucket: ${MD_IMAGE_MINIO_BUCKET:${MINIO_ASSET_BUCKET:kb-assets}}
        vision-provider: ${MD_IMAGE_VISION_PROVIDER:DASHSCOPE}
        vision-model: ${MD_IMAGE_VISION_MODEL:qwen-vl-max}
        dashscope-base-url: ${MD_IMAGE_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        max-count: ${MD_IMAGE_MAX_COUNT:50}
        max-size-mb: ${MD_IMAGE_MAX_SIZE_MB:10}
        allowed-mime-types:
          - image/png
          - image/jpeg
          - image/webp
    milvus:
      md-collection: ${MILVUS_MD_COLLECTION:md_kb_chunks}
    search:
      md-parent-expansion:
        max-parents: ${MD_PARENT_EXPANSION_MAX_PARENTS:5}
        max-chars-per-parent: ${MD_PARENT_EXPANSION_MAX_CHARS_PER_PARENT:2000}
        max-windows-per-parent: ${MD_PARENT_EXPANSION_MAX_WINDOWS_PER_PARENT:3}
        max-context-chars: ${MD_PARENT_EXPANSION_MAX_CONTEXT_CHARS:10000}
    storage:
      base-path: ${FILE_STORAGE_PATH:./uploads}
      minio:
        endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
        access-key: ${MINIO_ACCESS_KEY:minioadmin}
        secret-key: ${MINIO_SECRET_KEY:minioadmin123}
        bucket: ${MINIO_ASSET_BUCKET:kb-assets}
    document:
      allowed-mime-types:
        - application/pdf
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/msword
        - text/markdown
        - text/x-markdown
        - application/zip
        - application/x-zip-compressed
        - text/plain
        - text/html
      max-file-size-mb: 100
      markdown-archive:
        max-file-count: ${MARKDOWN_ARCHIVE_MAX_FILE_COUNT:200}
        max-extracted-size-mb: ${MARKDOWN_ARCHIVE_MAX_EXTRACTED_SIZE_MB:200}
        max-image-count: ${MARKDOWN_ARCHIVE_MAX_IMAGE_COUNT:100}
        max-image-size-mb: ${MARKDOWN_ARCHIVE_MAX_IMAGE_SIZE_MB:20}
      visual:
        worker:
          fixed-delay-ms: ${VISUAL_ASSET_WORKER_FIXED_DELAY_MS:30000}
          batch-size: ${VISUAL_ASSET_WORKER_BATCH_SIZE:10}
          max-retries: ${VISUAL_ASSET_WORKER_MAX_RETRIES:3}
          retry-delay-seconds: ${VISUAL_ASSET_WORKER_RETRY_DELAY_SECONDS:60}
    chunking:
      chunk-size: 512
      overlap-tokens: 100
      markdown:
        max-tokens: ${MD_CHUNK_MAX_TOKENS:512}
        min-tokens: ${MD_CHUNK_MIN_TOKENS:64}
        split-heading-levels: 3

logging:
  level:
    com.enterprise.kb: debug
    org.springframework.ai: INFO
    org.springframework.security: WARN
