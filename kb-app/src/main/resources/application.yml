server:
  port: 8081
  servlet:
    context-path: /
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: enterprise-kb

  autoconfigure:
    exclude:
      # 标准 RAG 退役：排除会创建并初始化 kb_chunks 集合的自动配置；
      # Milvus 客户端改由 AppConfig.milvusClient 手动声明，仅供 md_kb_chunks 使用。
      - org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration

  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:dge2026}
      database: 0

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/enterprise_kb}
    username: ${SPRING_DATASOURCE_USERNAME:kb_user}
    password: ${SPRING_DATASOURCE_PASSWORD:dge2026}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  web:
    resources:
      static-locations: file:kb-app/src/main/resources/static/,classpath:/static/

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 200MB

  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v2
      rerank:
        options:
          model: gte-rerank-v2

    # Spring AI 官方 prompt/completion 应用日志开关（design-langfuse-io-mapping D3）。
    # 与 tracing 总开关解耦，默认全关：这些开关只把正文打进【应用日志】，不会让 LangFuse
    # 出现 input/output，也不经项目的脱敏收口。LangFuse input/output 由本项目业务 span
    # （TracingSupport.traceInput/outputFrom 等，内置脱敏截断）负责写入。
    chat:
      observations:
        log-prompt: ${KB_AI_LOG_PROMPT:false}
        log-completion: ${KB_AI_LOG_COMPLETION:false}
        include-error-logging: ${KB_AI_LOG_ERROR:false}

    # ADR-015 跨线程传播 ③：关闭 DashScope 异步 tool calling manager，
    # 工具同步在调用线程执行，最大化 thread-local 直接命中、减少 span 脱树的不确定性。
    alibaba:
      tool:
        async:
          enabled: false

    # Milvus 自动配置已被 spring.autoconfigure.exclude 排除（标准 RAG 退役）。
    # 以下仅供 AppConfig.milvusClient 与 mdVectorStore（md_kb_chunks）读取连接信息。
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
        database-name: default
        embedding-dimension: 1536

  # 用户画像离线推断的 Kafka（ADR-016，Phase 2）。bootstrap-servers 为空时不连接；
  # 消费者容器由 ProfileInferenceWorker 的 @ConditionalOnProperty 控制，默认关时不装配、不连 broker。
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    consumer:
      group-id: ${KB_PROFILE_CONSUMER_GROUP:profile-inference}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # broker 不可用时快速失败（默认 60s 会长时间阻塞发送），随后由监听器降级到本地线程池
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:3000}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    jdbc-type-for-null: NULL
  type-handlers-package: com.enterprise.kb.document.typehandler
  type-aliases-package: >
    com.enterprise.kb.user.model,
    com.enterprise.kb.auth.model,
    com.enterprise.kb.document.model,
    com.enterprise.kb.graph.model

pagehelper:
  helper-dialect: postgresql
  reasonable: true
  support-methods-arguments: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  # 在线 LLM Tracing（ADR-015）。总开关 KB_TRACING_ENABLED 默认 false：
  # 关闭时 Micrometer tracing 不装配，Observation 不产 span，运行态零额外开销；
  # 开启时按 sampling.probability 采样，并仅在 OTLP traces endpoint 就绪时才真正导出到 LangFuse。
  tracing:
    enabled: ${KB_TRACING_ENABLED:false}
    sampling:
      probability: ${KB_TRACING_SAMPLE_RATIO:1.0}
  otlp:
    tracing:
      # 直连 LangFuse 时使用 trace-specific endpoint /api/public/otel/v1/traces；
      # 经 OTel Collector 转发时可改用通用 /api/public/otel。为空则不装配导出器。
      # x-langfuse-ingestion-version 是 Langfuse 的 OTLP 摄取版本声明 header
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:}
      headers:
        Authorization: "Basic ${LANGFUSE_OTLP_BASIC_AUTH:}"
        x-langfuse-ingestion-version: "4"

enterprise:
  kb:
    # 在线 LLM Tracing（ADR-015）总开关 + 自定义 tracing bean 的脱敏/截断参数。
    # enabled 默认 false：关闭时 reactor 传播 hook、脱敏 filter、业务属性 SpanProcessor、
    # 各 service 入口根 span 均不生效，应用照常启动（LangFuse 未起也不影响）。
    tracing:
      enabled: ${KB_TRACING_ENABLED:false}
      # 进入 trace 的各类正文字符数硬上限（超出仅保留截断标记 + 原始长度）
      max-prompt-chars: ${KB_TRACING_MAX_PROMPT_CHARS:8000}
      max-completion-chars: ${KB_TRACING_MAX_COMPLETION_CHARS:8000}
      max-tool-chars: ${KB_TRACING_MAX_TOOL_CHARS:4000}
      max-retrieval-chars: ${KB_TRACING_MAX_RETRIEVAL_CHARS:4000}
      # 基础设施 span 黑名单：observation name 命中以下任一前缀即不进 trace（大小写不敏感前缀匹配）。
      # 面向 Langfuse 使用场景过滤已知基础设施噪音；业务链路（kb.* / chat * / embedding * /
      # gen_ai.* / spring.ai.tool / md-documents/upload / md-qa）与未知 observation 默认放行。
      # 排查 Security/Scheduler 问题时，可临时清空 KB_TRACING_EXCLUDED_OBSERVATION_NAME_PREFIXES（逗号分隔，
      # 整体覆盖此列表）恢复基础设施 span 可见。
      excluded-observation-name-prefixes:
        - "tasks.scheduled.execution"
        - "security filterchain"
        - "authorize request"
        - "authorize method"
        - "secured request"
        - "http get /actuator/health"
        - "http.server.requests"
        - "spring.security"
    jwt:
      secret: ${JWT_SECRET:e25007bd691e02e014a1809d87fcda0fa1e9800f0accd3d2a5be68298b96833f}
      access-token-expiry-minutes: 60
      refresh-token-expiry-days: 30
    ai:
      default-provider: ${AI_DEFAULT_PROVIDER:LLAMA_CPP}
      default-embedding-provider: DASHSCOPE
      llama-cpp:
        enabled: ${LLAMA_CPP_ENABLED:true}
        base-url: ${LLAMA_CPP_BASE_URL:http://localhost:8079}
        api-key: ${LLAMA_CPP_API_KEY:local}
        # 纯文本 Qwen3 原版混合权重（支持 /think·/no_think 软开关）；视觉走 DashScope 入库，本地链路不需要 VL
        model: ${LLAMA_CPP_MODEL:qwen3-14b}
      context-limit: ${AI_CONTEXT_LIMIT:8192}
      agentic:
        chunk-token-size: ${AI_AGENTIC_CHUNK_TOKEN_SIZE:512}
      # 两层域路由的 Tier-1 路由器配置
      router-provider: ${ROUTER_PROVIDER:LLAMA_CPP}
      router-context-turns: ${ROUTER_CONTEXT_TURNS:3}
    customer-assistant:
      # 路由架构 kill-switch：true 走两层路由流水线，false 回退旧单体 ReactAgent 路径
      routing-enabled: ${CUSTOMER_ASSISTANT_ROUTING_ENABLED:true}
      # 影子模式：旧路径下旁路跑一次 Tier-1 域路由，仅记录判定结果用于评估对照
      shadow-routing-enabled: ${CUSTOMER_ASSISTANT_SHADOW_ROUTING_ENABLED:true}
    md:
      # md 关键词路算法：TRGM(默认，pg_trgm 子串相似度) / BM25(vchord_bm25 词级打分)，一键回退
      keyword-mode: ${MD_KEYWORD_MODE:BM25}
      # 索引与查询共用的 pg_tokenizer 配置名（建于运维脚本 db/manual/md-bm25-build.sql）
      bm25-tokenizer: ${MD_BM25_TOKENIZER:md_tok}
      # vchord_bm25 索引名，to_bm25query 按名引用
      bm25-index: ${MD_BM25_INDEX:idx_md_child_bm25}
      image:
        minio-endpoint: ${MD_IMAGE_MINIO_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
        bucket: ${MD_IMAGE_MINIO_BUCKET:${MINIO_ASSET_BUCKET:kb-assets}}
        vision-provider: ${MD_IMAGE_VISION_PROVIDER:DASHSCOPE}
        vision-model: ${MD_IMAGE_VISION_MODEL:qwen-vl-max}
        dashscope-base-url: ${MD_IMAGE_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        max-count: ${MD_IMAGE_MAX_COUNT:50}
        max-size-mb: ${MD_IMAGE_MAX_SIZE_MB:10}
        allowed-mime-types:
          - image/png
          - image/jpeg
          - image/webp
    milvus:
      md-collection: ${MILVUS_MD_COLLECTION:md_kb_chunks}
    search:
      md-parent-expansion:
        max-parents: ${MD_PARENT_EXPANSION_MAX_PARENTS:5}
        max-chars-per-parent: ${MD_PARENT_EXPANSION_MAX_CHARS_PER_PARENT:2000}
        max-windows-per-parent: ${MD_PARENT_EXPANSION_MAX_WINDOWS_PER_PARENT:3}
        max-context-chars: ${MD_PARENT_EXPANSION_MAX_CONTEXT_CHARS:10000}
    # 用户画像与个性化问答（ADR-016）
    profile:
      # 在线注入总开关（Phase 1）：关则问答 prompt 不注入 <user_profile> 块
      injection-enabled: ${KB_PROFILE_INJECTION_ENABLED:true}
      # 对话内偏好捕获（ADR-016 决策15）：识别"以后用中文"等持久声明 → 写入显式偏好 + 回执
      capture:
        enabled: ${KB_PROFILE_CAPTURE_ENABLED:true}
        provider: ${KB_PROFILE_CAPTURE_PROVIDER:LLAMA_CPP}
      inference:
        # 离线推断总开关（Phase 2）：关则 producer 监听器与 worker 均不装配，应用无需 Kafka 即可启动
        enabled: ${KB_PROFILE_INFERENCE_ENABLED:false}
        # 推断资历用的模型提供商（轻量分类，用便宜快模型）
        provider: ${KB_PROFILE_INFERENCE_PROVIDER:LLAMA_CPP}
        # 活动事件 topic
        topic: ${KB_PROFILE_ACTIVITY_TOPIC:kb.user.activity}
        # 推断取用的近 N 条本人提问
        recent-message-limit: ${KB_PROFILE_RECENT_MSG_LIMIT:50}
        # 去抖：距上次推断新消息 ≥ 此值才重算
        min-new-messages: ${KB_PROFILE_MIN_NEW_MESSAGES:10}
        # 去抖：距上次推断间隔 ≥ 此小时数才重算
        min-interval-hours: ${KB_PROFILE_MIN_INTERVAL_HOURS:6}
        # 置信闸：推断资历低于此值不应用
        confidence-threshold: ${KB_PROFILE_CONFIDENCE_THRESHOLD:0.7}
        # Kafka 不可用时的降级线程池（有界，满则丢弃本次推断，提供背压）
        fallback:
          core-pool-size: ${KB_PROFILE_FALLBACK_CORE_POOL:1}
          max-pool-size: ${KB_PROFILE_FALLBACK_MAX_POOL:2}
          queue-capacity: ${KB_PROFILE_FALLBACK_QUEUE:200}
    eval:
      ragas:
        enabled: ${RAGAS_EVAL_ENABLED:true}
        endpoint: ${RAGAS_ENDPOINT:http://localhost:8000}
        judge-provider: ${RAGAS_JUDGE_PROVIDER:DASHSCOPE}
        judge-model: ${RAGAS_JUDGE_MODEL:qwen-max}
        embedding-provider: ${RAGAS_EMBEDDING_PROVIDER:DASHSCOPE}
        embedding-model: ${RAGAS_EMBEDDING_MODEL:text-embedding-v3}
        poll-interval-seconds: ${RAGAS_POLL_INTERVAL_SECONDS:5}
        timeout-minutes: ${RAGAS_TIMEOUT_MINUTES:30}
        max-items-per-batch: ${RAGAS_MAX_ITEMS_PER_BATCH:100}
        gate-mode: ${RAGAS_GATE_MODE:warn}
        metrics:
          - faithfulness
          - answer_relevancy
          - context_precision
          - context_recall
        thresholds:
          faithfulness: ${RAGAS_THRESHOLD_FAITHFULNESS:0.85}
          answer_relevancy: ${RAGAS_THRESHOLD_ANSWER_RELEVANCY:0.80}
          context_precision: ${RAGAS_THRESHOLD_CONTEXT_PRECISION:0.70}
          context_recall: ${RAGAS_THRESHOLD_CONTEXT_RECALL:0.75}
    storage:
      base-path: ${FILE_STORAGE_PATH:./uploads}
      minio:
        endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
        access-key: ${MINIO_ACCESS_KEY:minioadmin}
        secret-key: ${MINIO_SECRET_KEY:minioadmin123}
        bucket: ${MINIO_ASSET_BUCKET:kb-assets}
    document:
      allowed-mime-types:
        - application/pdf
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/msword
        - text/markdown
        - text/x-markdown
        - application/zip
        - application/x-zip-compressed
        - text/plain
        - text/html
      max-file-size-mb: 100
      markdown-archive:
        max-file-count: ${MARKDOWN_ARCHIVE_MAX_FILE_COUNT:200}
        max-extracted-size-mb: ${MARKDOWN_ARCHIVE_MAX_EXTRACTED_SIZE_MB:200}
        max-image-count: ${MARKDOWN_ARCHIVE_MAX_IMAGE_COUNT:100}
        max-image-size-mb: ${MARKDOWN_ARCHIVE_MAX_IMAGE_SIZE_MB:20}
      visual:
        worker:
          fixed-delay-ms: ${VISUAL_ASSET_WORKER_FIXED_DELAY_MS:30000}
          batch-size: ${VISUAL_ASSET_WORKER_BATCH_SIZE:10}
          max-retries: ${VISUAL_ASSET_WORKER_MAX_RETRIES:3}
          retry-delay-seconds: ${VISUAL_ASSET_WORKER_RETRY_DELAY_SECONDS:60}
    chunking:
      chunk-size: 512
      overlap-tokens: 100
      markdown:
        max-tokens: ${MD_CHUNK_MAX_TOKENS:512}
        min-tokens: ${MD_CHUNK_MIN_TOKENS:64}
        split-heading-levels: 3

logging:
  level:
    com.enterprise.kb: debug
    org.springframework.ai: INFO
    org.springframework.security: WARN
